# Added 2026-10-27 (v1.4.0)

- id: system-one-model
  term: System One Model
  category: foundations
  definition: A System One model is a kind of AI model, named by TypeSafe AI in 2026, that returns typed, probabilistic decisions matching an output structure defined in advance, such as a label, score or branch choice with a confidence value, instead of generating free text token by token.
  body: TypeSafe introduced the term in September 2026 with its first such model, Jev, describing the class as built for fast, structured decisions that software can use directly, such as classifying, routing, scoring, extracting and branching. The possible outputs are declared as types, all fields are produced in a single parallel pass, and each answer carries calibrated probabilities. This differs from structured outputs, where a generative language model's text is constrained to a schema. The vendor states that the model cannot hallucinate and that type errors are impossible, but also notes that its zero-hallucination figure follows from guaranteed schema matching rather than measurement. As of October 2026 the performance figures are vendor-reported and had not been independently reproduced.
  aliases: [decision model, System One]
  related: [structured-outputs, confidence-calibration, routing, hallucination, large-language-model]
  introduced: 2026
  added: 2026-10-27
  sources:
    - {title: "Introducing System One Models & Jev", authors: "Almeida (TypeSafe)", year: 2026, url: "https://typesafe.ai/blog/introducing-system-one-models-and-jev"}
    - {title: "Jev: TypeSafe's System One Model That Never Hallucinates", authors: "Crabtree (DataCamp)", year: 2026, url: "https://www.datacamp.com/blog/system-one-models-jev"}

- id: dark-factory
  term: Dark Factory
  category: agents
  definition: A dark factory, or software factory, is a way of building software in which AI coding agents write, test and ship code from specifications and test scenarios with no human writing or reviewing the code, while people design the specifications, validation and environment the agents work in.
  body: Dan Shapiro used the name in January 2026 for the top level of his five levels of AI-assisted programming, borrowing it from lights-out manufacturing plants run by robots. StrongDM described its practice the following month under two rules, that code must not be written by humans and must not be reviewed by humans. Because nobody reads the code, confidence comes from validation instead. StrongDM keeps end-to-end scenarios outside the codebase, where the coding agents cannot see them, much like a holdout set in model training, and has an LLM judge whether the software satisfies them. It also tests against agent-built behavioral clones of the third-party services the software depends on. Unlike vibe coding, which also skips reading the code, the approach depends on substantial testing infrastructure. Its practicality beyond small, specialized teams is disputed.
  aliases: [software factory, dark software factory]
  related: [coding-agent, vibe-coding, harness-engineering, spec-driven-development, evals, llm-as-a-judge]
  introduced: 2026
  added: 2026-10-27
  sources:
    - {title: "Software Factories And The Agentic Moment", authors: "McCarthy (StrongDM)", year: 2026, url: "https://factory.strongdm.ai/"}
    - {title: "How StrongDM's AI team build serious software without even looking at the code", authors: "Willison", year: 2026, url: "https://simonwillison.net/2026/Feb/7/software-factory/"}

- id: spec-driven-development
  term: Spec-Driven Development
  category: agents
  definition: Spec-driven development is an approach to building software with AI coding agents in which a written specification of what the software should do, and why, is created and refined first, and the agent then derives a technical plan, a task list and the code from it, with the specification kept as the source of truth.
  body: GitHub's open-source Spec Kit, released in September 2025, structures the process in four phases. The developer describes what they are building and why, and the agent expands it into a detailed specification. The developer then supplies technical direction, and the agent writes an implementation plan. The agent breaks the specification and plan into small, independently testable tasks, then implements them while the developer reviews focused changes. The specification acts as a contract that agents and tools use to generate, test and validate code. In vibe coding, by contrast, intent lives only in the chat prompts.
  aliases: [SDD]
  related: [coding-agent, vibe-coding, plan-and-execute, dark-factory, agent-skills, prompt-chaining]
  introduced: 2025
  added: 2026-10-27
  sources:
    - {title: "Spec-driven development with AI: Get started with a new open source toolkit", authors: "Delimarsky (GitHub)", year: 2025, url: "https://github.blog/ai-and-ml/generative-ai/spec-driven-development-with-ai-get-started-with-a-new-open-source-toolkit/"}

- id: evaluation-awareness
  term: Evaluation Awareness
  category: failure-modes
  definition: Evaluation awareness is a language model's ability to tell whether it is being evaluated or used in real deployment, which can make its behavior during tests unrepresentative of its behavior in use.
  body: In the introducing study, frontier models classified 1,000 transcripts drawn from 61 datasets as evaluation or deployment above chance but below a human baseline, with the best model reaching an AUC of 0.83 against 0.92 for humans. They did better on agentic transcripts than on chat, and could often tell whether an evaluation tested capability or alignment. Later work found that evaluation awareness is linearly decodable from the internal activations of every open-weight model tested, even though models rarely say they are being evaluated, and that steering along that direction increases how often they say so. The authors recommend measuring the internal representation, its verbalization and its sensitivity to steering separately. Evaluation awareness matters because safety and alignment evaluations assume a model behaves the same whether or not it is observed.
  aliases: [eval awareness]
  related: [alignment-faking, evals, red-teaming, chain-of-thought-monitoring, activation-steering, benchmark-saturation]
  introduced: 2025
  added: 2026-10-27
  sources:
    - {title: "Large Language Models Often Know When They Are Being Evaluated", authors: "Needham et al.", year: 2025, url: "https://arxiv.org/abs/2505.23836"}
    - {title: "Evaluation Awareness in Language Models: Representation, Verbalization, and Control", authors: "Heidari et al.", year: 2026, url: "https://arxiv.org/abs/2608.21766"}

- id: diffusion-language-model
  term: Diffusion Language Model
  category: foundations
  definition: A diffusion language model generates text by starting from a fully corrupted sequence, such as all mask tokens or noise over token embeddings, and refining the whole sequence over a series of denoising steps, instead of producing one token at a time from left to right.
  body: There are two main families. Discrete diffusion models corrupt the tokens themselves, most often by replacing them with a mask token, and learn to restore them. Continuous diffusion models first map tokens to real-valued embeddings and add Gaussian-style noise to those. Diffusion-LM was an early continuous model aimed at controllable generation. LLaDA, a masked diffusion model trained from scratch at scale, performed comparably to autoregressive baselines, which suggested that strong language-model abilities do not depend on left-to-right generation. Because a diffusion model updates many positions in each step, it can produce several tokens per step and condition on text both before and after a position.
  aliases: [diffusion LM, DLM, dLLM, masked diffusion language model, continuous diffusion language model, CDLM]
  related: [large-language-model, speculative-decoding, foundation-model]
  introduced: 2022
  added: 2026-10-27
  sources:
    - {title: "Diffusion-LM Improves Controllable Text Generation", authors: "Li et al.", year: 2022, url: "https://arxiv.org/abs/2205.14217"}
    - {title: "Large Language Diffusion Models", authors: "Nie et al.", year: 2025, url: "https://arxiv.org/abs/2502.09992"}
    - {title: "Continuous diffusion language models", authors: "Dieleman", year: 2026, url: "https://sander.ai/2026/08/24/continuous-dlms.html"}

- id: mixture-of-experts
  term: Mixture of Experts
  category: foundations
  definition: Mixture of experts (MoE) is a neural network architecture in which a layer contains many parallel sub-networks, called experts, and a learned router sends each token to only a few of them, so a model's total parameter count can grow much faster than the computation it uses per token.
  body: The sparsely gated mixture-of-experts layer placed thousands of experts between the layers of a language model and activated only a small number per input. The Switch Transformer simplified this by routing each token to a single expert, which reduced communication costs and made training at a trillion parameters practical. MoE language models are therefore described by two numbers, total parameters and active parameters per token. Training needs a balancing mechanism so the router does not send most tokens to a few experts, and all experts must still be held in memory at inference time. The name is unrelated to mixture-of-agents, which combines the outputs of separate models.
  aliases: [MoE, sparse mixture of experts, sparsely-gated mixture of experts]
  related: [large-language-model, foundation-model, routing, mixture-of-agents]
  introduced: 2017
  added: 2026-10-27
  sources:
    - {title: "Outrageously Large Neural Networks: The Sparsely-Gated Mixture-of-Experts Layer", authors: "Shazeer et al.", year: 2017, url: "https://arxiv.org/abs/1701.06538"}
    - {title: "Switch Transformers: Scaling to Trillion Parameter Models with Simple and Efficient Sparsity", authors: "Fedus, Zoph and Shazeer", year: 2021, url: "https://arxiv.org/abs/2101.03961"}

- id: quantization
  term: Quantization
  category: optimization
  definition: Quantization reduces the numeric precision of a model's weights, and sometimes its activations, from 16- or 32-bit floating point to lower-precision formats such as 8-bit or 4-bit integers, cutting memory use and inference cost at some cost in accuracy.
  body: Post-training quantization is applied to a model that has already been trained, without retraining it. LLM.int8() made 8-bit inference practical for large models by keeping a small number of outlier feature dimensions in higher precision. GPTQ quantizes weights to 3 or 4 bits in a single pass, using approximate second-order information to keep accuracy loss small. Quantization is widely used to fit large open-weight models onto fewer GPUs or consumer hardware. Quantization-aware training, which simulates low precision during training, is an alternative to post-training methods. Quantization is often combined with other efficiency methods such as low-rank adaptation and knowledge distillation.
  aliases: [model quantization, post-training quantization, PTQ, weight quantization, GPTQ, LLM.int8()]
  related: [knowledge-distillation, low-rank-adaptation, kv-cache, speculative-decoding]
  introduced: 2022
  added: 2026-10-27
  sources:
    - {title: "LLM.int8(): 8-bit Matrix Multiplication for Transformers at Scale", authors: "Dettmers et al.", year: 2022, url: "https://arxiv.org/abs/2208.07339"}
    - {title: "GPTQ: Accurate Post-Training Quantization for Generative Pre-trained Transformers", authors: "Frantar et al.", year: 2022, url: "https://arxiv.org/abs/2210.17323"}

- id: interleaved-thinking
  term: Interleaved Thinking
  category: test-time
  definition: Interleaved thinking is a way of running a reasoning model in a tool-use loop in which the model produces new reasoning between tool calls, reasoning about each tool result before choosing its next action, and that reasoning is carried forward through the rest of the task.
  body: Without interleaving, a reasoning model typically thinks once before its first response and then calls tools without further reasoning. Anthropic's Messages API supports interleaved thinking for Claude tool use. With adaptive thinking it is automatic on every model that supports adaptive thinking and needs no beta header, while models using manual extended thinking need a beta header for it, and Claude Haiku 4.5 does not support it. The API requires that thinking blocks be passed back complete and unmodified along with tool results. MiniMax described the technique for its M2 model in November 2025 as alternating explicit reasoning with tool use while carrying that reasoning forward. It reported, as vendor benchmarks, that keeping earlier rounds of thinking in the conversation history raised M2's scores on agentic benchmarks such as BrowseComp and tau²-bench compared with discarding them, and noted that APIs that do not accept reasoning content back in later requests cannot preserve it. Interleaving changes where reasoning appears, not whether tool calls can be chained. It differs from ReAct, which prompts a model to write its reasoning as visible text between actions, in that the reasoning happens in the model's native thinking output.
  aliases: [interleaved reasoning, thinking between tool calls]
  broader: [extended-thinking]
  related: [reasoning-model, function-calling, react, ai-agent, test-time-compute-scaling]
  introduced: 2025
  added: 2026-11-07
  sources:
    - {title: "Thinking (Interleaved thinking)", authors: "Anthropic", year: 2026, url: "https://platform.claude.com/docs/en/build-with-claude/thinking"}
    - {title: "Thinking in tool and multi-turn workflows", authors: "Anthropic", year: 2026, url: "https://platform.claude.com/docs/build-with-claude/thinking-tool-workflows"}
    - {title: "Interleaved Thinking Unlocks Reliable MiniMax-M2 Agentic Capability", authors: "MiniMax", year: 2025, url: "https://minimax.io/news/why-is-interleaved-thinking-important-for-m2"}

- id: sandbagging
  term: Sandbagging
  category: failure-modes
  definition: Sandbagging is strategic underperformance on an evaluation, in which an AI system, or the developer who trains it, makes the system score below its true capability, for example so that it appears less dangerous on a dangerous-capability test.
  body: In the study that introduced the term for language models, prompted frontier models such as GPT-4 and Claude 3 Opus selectively underperformed on dangerous-capability questions while staying strong on harmless ones. Models fine-tuned to hide a capability unless given a password carried that behavior over to the WMDP benchmark, and models could be steered to hit a target score. Later work found that Claude 3.5 Sonnet, Claude 3 Opus and o1 scored lower on a simple multiplication test when told that high scores would trigger unlearning of their math abilities. Claude 3.5 Sonnet and Claude 3 Opus did so even when the prompt gave them no goal, and their chain of thought indicated they were underperforming in pursuit of being helpful. Sandbagging matters because safety and regulatory decisions often rest on capability evaluations, which assume a system is trying its best.
  aliases: [AI sandbagging, strategic underperformance]
  related: [evaluation-awareness, alignment-faking, evals, red-teaming, chain-of-thought-monitoring]
  introduced: 2024
  added: 2026-11-07
  sources:
    - {title: "AI Sandbagging: Language Models can Strategically Underperform on Evaluations", authors: "van der Weij et al.", year: 2024, url: "https://arxiv.org/abs/2406.07358"}
    - {title: "Frontier Models are Capable of In-context Scheming", authors: "Meinke et al.", year: 2024, url: "https://arxiv.org/abs/2412.04984"}

- id: model-collapse
  term: Model Collapse
  category: failure-modes
  definition: Model collapse is a degenerative process in which generative models trained on data produced by earlier models progressively lose information about the original data distribution, starting with its rare cases.
  body: Shumailov et al. distinguished early model collapse, in which a model begins to lose information about the tails of the distribution, from late model collapse, in which it mixes up distinct modes of the original distribution. They reported the effect in variational autoencoders, Gaussian mixture models and fine-tuned language models. An expanded version was published in Nature in 2024. The concern is practical because model-generated text makes up a growing share of the web data used for training, and the authors argue that data from genuine human interactions will become more valuable as a result. Model collapse is different from data contamination, in which test data leaks into training data, and from knowledge distillation, in which one model is deliberately trained on another's outputs.
  aliases: [curse of recursion, recursive training collapse]
  related: [data-contamination, knowledge-distillation, foundation-model, large-language-model]
  introduced: 2023
  added: 2026-11-07
  sources:
    - {title: "The Curse of Recursion: Training on Generated Data Makes Models Forget", authors: "Shumailov et al.", year: 2023, url: "https://arxiv.org/abs/2305.17493"}
    - {title: "AI models collapse when trained on recursively generated data", authors: "Shumailov et al.", year: 2024, url: "https://oatml.cs.ox.ac.uk/publications/202407_Shumailov_ModelCollapse.html"}

- id: agentic-engineering
  term: Agentic Engineering
  category: agents
  definition: Agentic engineering is the practice of developing software with the assistance of coding agents, with the developer reviewing the agent's code and bringing it up to the standard expected of production software.
  body: The term is used in contrast to vibe coding. Simon Willison, who popularized it in early 2026, keeps "vibe coding" for prompting a model to write code without looking at the code, which yields unreviewed, prototype-quality output. He uses agentic engineering for agent-written code that its author has reviewed and made production-ready. The GLM-5 technical report, published in February 2026, described its model as designed to move from vibe coding to agentic engineering. Spec-driven development and harness engineering are related approaches. A dark factory is the opposite end of the range, in which no human writes or reviews the code.
  aliases: [agentic software engineering]
  related: [coding-agent, vibe-coding, harness-engineering, spec-driven-development, dark-factory]
  introduced: 2026
  added: 2026-11-07
  sources:
    - {title: "What is agentic engineering? (Agentic Engineering Patterns)", authors: "Willison", year: 2026, url: "https://simonwillison.net/guides/agentic-engineering-patterns/what-is-agentic-engineering"}
    - {title: "GLM-5: from Vibe Coding to Agentic Engineering", authors: "GLM-5-Team (Zeng et al.)", year: 2026, url: "https://arxiv.org/abs/2602.15763"}

- id: cumulative-reasoning
  term: Cumulative Reasoning
  category: reasoning
  definition: Cumulative reasoning is a prompting framework in which a language model plays three roles, a proposer that suggests reasoning steps, a verifier that checks each step, and a reporter that composes the final answer from the verified steps, so that only checked propositions accumulate.
  body: Verified propositions build up in a directed acyclic graph rather than a single chain or tree, so a new step can draw on any combination of earlier verified steps. In the introducing paper the authors reported 98% accuracy on the Game of 24, 98.04% on a curated subset of the FOLIO logical-inference dataset, and gains on the MATH benchmark that were largest on its hardest problems. A variant that let the model run code outperformed program-of-thoughts. Compared with tree of thoughts, which searches over alternative paths, cumulative reasoning emphasizes checking each step before it can be used.
  aliases: [CR, cumulative reasoning prompting]
  broader: [chain-of-thought]
  related: [tree-of-thoughts, graph-of-thoughts, self-verification, program-of-thoughts]
  introduced: 2023
  added: 2026-11-07
  sources:
    - {title: "Cumulative Reasoning with Large Language Models", authors: "Zhang et al.", year: 2023, url: "https://arxiv.org/abs/2308.04371"}

- id: algorithm-of-thoughts
  term: Algorithm of Thoughts
  category: reasoning
  definition: Algorithm of thoughts (AoT) is a prompting technique that places worked examples of an algorithmic search process in the prompt, so the model carries out the whole search inside a single generation instead of being called repeatedly by an external controller.
  body: Methods such as tree of thoughts explore alternatives by pausing generation, evaluating partial solutions and calling the model again, which multiplies the number of queries and tokens. AoT keeps the exploration in one stream of output. Its authors reported that it outperformed earlier single-query methods and multi-query tree-search strategies while using significantly fewer tokens, and that a model guided by an algorithm could perform better than the algorithm itself.
  aliases: [AoT]
  broader: [chain-of-thought]
  related: [tree-of-thoughts, graph-of-thoughts, few-shot-prompting]
  introduced: 2023
  added: 2026-11-07
  sources:
    - {title: "Algorithm of Thoughts: Enhancing Exploration of Ideas in Large Language Models", authors: "Sel et al.", year: 2023, url: "https://arxiv.org/abs/2308.10379"}

- id: chain-of-note
  term: Chain-of-Note
  category: retrieval-tools
  definition: Chain-of-Note (CoN) is a retrieval-augmented generation method in which the model writes a short reading note for each retrieved document, assessing whether and how it bears on the question, before combining those notes into a final answer or saying that the answer is unknown.
  body: It targets two weaknesses of standard retrieval-augmented models. Irrelevant passages can mislead them into ignoring knowledge they already have, and they rarely admit when neither the documents nor their own knowledge contain the answer. The authors generated training notes with ChatGPT and fine-tuned a Llama 2 7B model on them. Across four open-domain question-answering benchmarks they reported an average gain of 7.9 exact-match points when all retrieved documents were noisy, and a 10.5-point higher rate of correctly declining questions about events after the model's training data.
  aliases: [CoN, chain-of-noting]
  related: [retrieval-augmented-generation, self-rag, corrective-rag, irrelevant-context-distraction]
  introduced: 2023
  added: 2026-11-07
  sources:
    - {title: "Chain-of-Note: Enhancing Robustness in Retrieval-Augmented Language Models", authors: "Yu et al.", year: 2023, url: "https://arxiv.org/abs/2311.09210"}

- id: flipped-interaction
  term: Flipped Interaction
  category: foundations
  definition: Flipped interaction is a prompt pattern in which the user asks the model to lead the conversation by asking questions, one or a few at a time, until it has the information it needs to complete a stated task.
  body: The pattern was named in a catalog of prompt patterns for ChatGPT, where it is listed among interaction patterns. A typical prompt states the goal and the stopping condition, for example "I would like you to ask me questions to achieve X. You should ask questions until this condition is met." The motivation is that the model often knows better than the user which details a task needs, so letting it ask can reach a good result faster than the user trying to specify everything up front.
  aliases: [flipped interaction pattern]
  related: [role-prompting, prompt-template, human-in-the-loop]
  introduced: 2023
  added: 2026-11-07
  sources:
    - {title: "A Prompt Pattern Catalog to Enhance Prompt Engineering with ChatGPT", authors: "White et al.", year: 2023, url: "https://arxiv.org/abs/2302.11382"}

- id: backward-chaining
  term: Backward Chaining
  category: reasoning
  definition: Backward chaining is a reasoning strategy that starts from the statement to be proved and works back to the facts and rules that would support it, rather than reasoning forward from the facts toward a conclusion.
  body: The idea comes from classical automated reasoning. LAMBADA applied it to language models by breaking the search into four sub-modules, each implemented with few-shot prompting. Its authors argued that forward methods such as chain-of-thought and selection-inference face a search space that grows combinatorially with the length of the proof, and reported substantial accuracy gains over them on logical reasoning datasets, largest where deep proof chains were needed. LAMBADA, the name of this method, is unrelated to the LAMBADA word-prediction benchmark.
  aliases: [backward reasoning]
  related: [chain-of-thought, least-to-most-prompting, self-verification]
  introduced: 2022
  added: 2026-11-07
  sources:
    - {title: "LAMBADA: Backward Chaining for Automated Reasoning in Natural Language", authors: "Kazemi et al.", year: 2022, url: "https://arxiv.org/abs/2212.13894"}

- id: parameter-efficient-fine-tuning
  term: Parameter-Efficient Fine-Tuning
  category: optimization
  definition: Parameter-efficient fine-tuning (PEFT) adapts a pretrained model to a task by training only a small number of added or selected parameters while the original weights stay frozen, instead of updating every weight as full fine-tuning does.
  body: Adapter modules were an early example. Houlsby et al. inserted small trainable layers into BERT and came within 0.4% of full fine-tuning on GLUE while adding only 3.6% parameters per task, so many tasks could share one frozen base model. Later methods include prompt tuning and prefix tuning, which learn continuous vectors added to the input or to each layer, and low-rank adaptation, which learns low-rank updates to weight matrices. PEFT lowers memory and storage costs, since each task needs only its small set of trained parameters, and QLoRA combines it with quantization to fine-tune very large models on a single GPU.
  aliases: [PEFT, parameter-efficient transfer learning]
  broader: [fine-tuning]
  related: [low-rank-adaptation, qlora, prompt-tuning, prefix-tuning, quantization]
  introduced: 2019
  added: 2026-11-07
  sources:
    - {title: "Parameter-Efficient Transfer Learning for NLP", authors: "Houlsby et al.", year: 2019, url: "https://arxiv.org/abs/1902.00751"}
    - {title: "Parameter-Efficient Fine-Tuning for Large Models: A Comprehensive Survey", authors: "Han et al.", year: 2024, url: "https://arxiv.org/abs/2403.14608"}

- id: qlora
  term: QLoRA
  category: optimization
  definition: QLoRA is a fine-tuning method that keeps a pretrained model frozen in 4-bit quantized form and trains low-rank adapters on top of it, backpropagating gradients through the quantized weights, which greatly reduces the memory needed to fine-tune large models.
  body: It introduced a 4-bit data type called NormalFloat (NF4) designed for normally distributed weights, double quantization, which also quantizes the quantization constants, and paged optimizers that absorb memory spikes during training. With these, the authors fine-tuned a 65-billion-parameter model on a single 48 GB GPU with performance they reported as matching 16-bit fine-tuning. Their Guanaco models, trained this way in about 24 hours on one GPU, reached 99.3% of ChatGPT's performance on the Vicuna benchmark in their evaluation. QLoRA made fine-tuning of large open-weight models practical on modest hardware.
  aliases: [quantized LoRA, quantized low-rank adaptation]
  broader: [low-rank-adaptation]
  related: [quantization, parameter-efficient-fine-tuning, fine-tuning]
  introduced: 2023
  added: 2026-11-07
  sources:
    - {title: "QLoRA: Efficient Finetuning of Quantized LLMs", authors: "Dettmers et al.", year: 2023, url: "https://arxiv.org/abs/2305.14314"}

- id: kahneman-tversky-optimization
  term: Kahneman-Tversky Optimization
  category: foundations
  definition: Kahneman-Tversky optimization (KTO) is a preference-alignment method that trains a language model from outputs labelled simply as desirable or undesirable, using a loss based on Kahneman and Tversky's prospect theory, instead of requiring pairs of preferred and dispreferred responses.
  body: Its authors described a family of "human-aware losses" whose objectives implicitly encode biases from prospect theory, such as loss aversion, and argued this partly explains why direct preference optimization works better than plain likelihood training. KTO maximizes a prospect-theoretic utility of generations directly. Because a single thumbs-up or thumbs-down label is cheaper and more plentiful than a ranked pair, KTO can use feedback that pairwise methods cannot. The authors reported that it matched or exceeded preference-based methods at scales from 1 to 30 billion parameters, and concluded that no single such loss is best in every setting.
  aliases: [KTO]
  related: [direct-preference-optimization, rlhf, odds-ratio-preference-optimization, reward-model]
  introduced: 2024
  added: 2026-11-07
  sources:
    - {title: "KTO: Model Alignment as Prospect Theoretic Optimization", authors: "Ethayarajh et al.", year: 2024, url: "https://arxiv.org/abs/2402.01306"}

- id: odds-ratio-preference-optimization
  term: Odds Ratio Preference Optimization
  category: foundations
  definition: Odds ratio preference optimization (ORPO) aligns a language model with preferences in a single training stage by adding an odds-ratio penalty that favors preferred over dispreferred responses to the ordinary supervised fine-tuning loss, with no reference model and no separate preference-tuning phase.
  body: Its authors argued that supervised fine-tuning is needed for preference alignment to converge and that a small penalty on the disfavored response style during that fine-tuning is enough. Methods such as RLHF and direct preference optimization usually follow a separate supervised stage and keep a frozen reference model, which ORPO avoids. Fine-tuning Phi-2, Llama 2 7B and Mistral 7B with ORPO on the UltraFeedback dataset alone, they reported scores of up to 12.20% on AlpacaEval 2.0, 66.19% on IFEval and 7.32 on MT-Bench.
  aliases: [ORPO, monolithic preference optimization]
  related: [direct-preference-optimization, instruction-tuning, rlhf, kahneman-tversky-optimization]
  introduced: 2024
  added: 2026-11-07
  sources:
    - {title: "ORPO: Monolithic Preference Optimization without Reference Model", authors: "Hong, Lee and Thorne", year: 2024, url: "https://arxiv.org/abs/2403.07691"}

- id: rlaif
  term: Reinforcement Learning from AI Feedback
  category: foundations
  definition: Reinforcement learning from AI feedback (RLAIF) is a variant of reinforcement learning from human feedback in which the preference labels used to train the reward model, or the rewards themselves, come from a language model instead of human annotators.
  body: It was introduced as part of Constitutional AI, where a model judged responses against written principles. Lee et al. compared it directly with RLHF and found comparable results on summarization, helpful dialogue and harmless dialogue. They also described direct RLAIF, which skips reward-model training and takes rewards from an off-the-shelf model during reinforcement learning, and reported that it outperformed the standard setup. RLAIF beat a supervised fine-tuned baseline even when the labelling model was the same size as the policy, which the authors presented as a step toward self-improvement. Its appeal is that AI labels are far cheaper to collect at scale than human ones.
  aliases: [RLAIF, direct RLAIF, d-RLAIF]
  broader: [rlhf]
  related: [constitutional-ai, reward-model, llm-as-a-judge]
  introduced: 2022
  added: 2026-11-07
  sources:
    - {title: "Constitutional AI: Harmlessness from AI Feedback", authors: "Bai et al.", year: 2022, url: "https://arxiv.org/abs/2212.08073"}
