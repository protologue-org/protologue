- id: self-instruct
  term: Self-Instruct
  category: foundations
  definition: Self-Instruct is a method for building instruction-tuning data in which a language model generates new task instructions, inputs and outputs from a small seed set, the results are filtered to remove invalid or near-duplicate examples, and the model is then fine-tuned on them.
  body: Applied to the original GPT-3, it produced a 33% absolute improvement on the Super-NaturalInstructions benchmark, roughly matching InstructGPT-001, with almost no human-written training data. The approach made synthetic instruction data a standard ingredient of instruction tuning and inspired later methods such as Evol-Instruct.
  aliases: []
  related: [instruction-tuning, evol-instruct, knowledge-distillation]
  introduced: 2022
  added: 2026-11-07
  sources:
    - {title: "Self-Instruct: Aligning Language Models with Self-Generated Instructions", authors: "Wang et al.", year: 2022, url: "https://arxiv.org/abs/2212.10560"}

- id: evol-instruct
  term: Evol-Instruct
  category: foundations
  definition: Evol-Instruct is a method for generating instruction-tuning data in which a language model repeatedly rewrites a starting set of instructions into more complex versions, producing a range of difficulty levels to train on.
  body: The authors mixed the evolved instructions and their responses to fine-tune LLaMA, producing the WizardLM models. Human evaluators rated the evolved instructions above human-written ones, and on the most complex test questions WizardLM's answers were preferred over ChatGPT's, although it still trailed ChatGPT in other areas. Where Self-Instruct mainly generates new instructions, Evol-Instruct focuses on making them progressively harder.
  aliases: []
  related: [self-instruct, instruction-tuning]
  introduced: 2023
  added: 2026-11-07
  sources:
    - {title: "WizardLM: Empowering Large Language Models to Follow Complex Instructions", authors: "Xu et al.", year: 2023, url: "https://arxiv.org/abs/2304.12244"}
