# Added 2026-10-27 (v1.4.0)

- id: system-one-model
  term: System One Model
  category: foundations
  definition: A System One model is a kind of AI model, named by TypeSafe AI in 2026, that returns typed, probabilistic decisions matching an output structure defined in advance, such as a label, score or branch choice with a confidence value, instead of generating free text token by token.
  body: TypeSafe introduced the term in September 2026 with its first such model, Jev, describing the class as built for fast, structured decisions that software can use directly, such as classifying, routing, scoring, extracting and branching. The possible outputs are declared as types, all fields are produced in a single parallel pass, and each answer carries calibrated probabilities. This differs from structured outputs, where a generative language model's text is constrained to a schema. The vendor states that the model cannot hallucinate and that type errors are impossible, but also notes that its zero-hallucination figure follows from guaranteed schema matching rather than measurement. As of October 2026 the performance figures are vendor-reported and had not been independently reproduced.
  aliases: [decision model, System One]
  related: [structured-outputs, confidence-calibration, routing, hallucination, large-language-model]
  introduced: 2026
  added: 2026-10-27
  sources:
    - {title: "Introducing System One Models & Jev", authors: "Almeida (TypeSafe)", year: 2026, url: "https://typesafe.ai/blog/introducing-system-one-models-and-jev"}
    - {title: "Jev: TypeSafe's System One Model That Never Hallucinates", authors: "Crabtree (DataCamp)", year: 2026, url: "https://www.datacamp.com/blog/system-one-models-jev"}

- id: dark-factory
  term: Dark Factory
  category: agents
  definition: A dark factory, or software factory, is a way of building software in which AI coding agents write, test and ship code from specifications and test scenarios with no human writing or reviewing the code, while people design the specifications, validation and environment the agents work in.
  body: Dan Shapiro used the name in January 2026 for the top level of his five levels of AI-assisted programming, borrowing it from lights-out manufacturing plants run by robots. StrongDM described its practice the following month under two rules, that code must not be written by humans and must not be reviewed by humans. Because nobody reads the code, confidence comes from validation instead. StrongDM keeps end-to-end scenarios outside the codebase, where the coding agents cannot see them, much like a holdout set in model training, and has an LLM judge whether the software satisfies them. It also tests against agent-built behavioral clones of the third-party services the software depends on. Unlike vibe coding, which also skips reading the code, the approach depends on substantial testing infrastructure. Its practicality beyond small, specialized teams is disputed.
  aliases: [software factory, dark software factory]
  related: [coding-agent, vibe-coding, harness-engineering, spec-driven-development, evals, llm-as-a-judge]
  introduced: 2026
  added: 2026-10-27
  sources:
    - {title: "Software Factories And The Agentic Moment", authors: "McCarthy (StrongDM)", year: 2026, url: "https://factory.strongdm.ai/"}
    - {title: "How StrongDM's AI team build serious software without even looking at the code", authors: "Willison", year: 2026, url: "https://simonwillison.net/2026/Feb/7/software-factory/"}

- id: spec-driven-development
  term: Spec-Driven Development
  category: agents
  definition: Spec-driven development is an approach to building software with AI coding agents in which a written specification of what the software should do, and why, is created and refined first, and the agent then derives a technical plan, a task list and the code from it, with the specification kept as the source of truth.
  body: GitHub's open-source Spec Kit, released in September 2025, structures the process in four phases. The developer describes what they are building and why, and the agent expands it into a detailed specification. The developer then supplies technical direction, and the agent writes an implementation plan. The agent breaks the specification and plan into small, independently testable tasks, then implements them while the developer reviews focused changes. The specification acts as a contract that agents and tools use to generate, test and validate code. In vibe coding, by contrast, intent lives only in the chat prompts.
  aliases: [SDD]
  related: [coding-agent, vibe-coding, plan-and-execute, dark-factory, agent-skills, prompt-chaining]
  introduced: 2025
  added: 2026-10-27
  sources:
    - {title: "Spec-driven development with AI: Get started with a new open source toolkit", authors: "Delimarsky (GitHub)", year: 2025, url: "https://github.blog/ai-and-ml/generative-ai/spec-driven-development-with-ai-get-started-with-a-new-open-source-toolkit/"}

- id: evaluation-awareness
  term: Evaluation Awareness
  category: failure-modes
  definition: Evaluation awareness is a language model's ability to tell whether it is being evaluated or used in real deployment, which can make its behavior during tests unrepresentative of its behavior in use.
  body: In the introducing study, frontier models classified 1,000 transcripts drawn from 61 datasets as evaluation or deployment above chance but below a human baseline, with the best model reaching an AUC of 0.83 against 0.92 for humans. They did better on agentic transcripts than on chat, and could often tell whether an evaluation tested capability or alignment. Later work found that evaluation awareness is linearly decodable from the internal activations of every open-weight model tested, even though models rarely say they are being evaluated, and that steering along that direction increases how often they say so. The authors recommend measuring the internal representation, its verbalization and its sensitivity to steering separately. Evaluation awareness matters because safety and alignment evaluations assume a model behaves the same whether or not it is observed.
  aliases: [eval awareness]
  related: [alignment-faking, evals, red-teaming, chain-of-thought-monitoring, activation-steering, benchmark-saturation]
  introduced: 2025
  added: 2026-10-27
  sources:
    - {title: "Large Language Models Often Know When They Are Being Evaluated", authors: "Needham et al.", year: 2025, url: "https://arxiv.org/abs/2505.23836"}
    - {title: "Evaluation Awareness in Language Models: Representation, Verbalization, and Control", authors: "Heidari et al.", year: 2026, url: "https://arxiv.org/abs/2608.21766"}

- id: diffusion-language-model
  term: Diffusion Language Model
  category: foundations
  definition: A diffusion language model generates text by starting from a fully corrupted sequence, such as all mask tokens or noise over token embeddings, and refining the whole sequence over a series of denoising steps, instead of producing one token at a time from left to right.
  body: There are two main families. Discrete diffusion models corrupt the tokens themselves, most often by replacing them with a mask token, and learn to restore them. Continuous diffusion models first map tokens to real-valued embeddings and add Gaussian-style noise to those. Diffusion-LM was an early continuous model aimed at controllable generation. LLaDA, a masked diffusion model trained from scratch at scale, performed comparably to autoregressive baselines, which suggested that strong language-model abilities do not depend on left-to-right generation. Because a diffusion model updates many positions in each step, it can produce several tokens per step and condition on text both before and after a position.
  aliases: [diffusion LM, DLM, dLLM, masked diffusion language model, continuous diffusion language model, CDLM]
  related: [large-language-model, speculative-decoding, foundation-model]
  introduced: 2022
  added: 2026-10-27
  sources:
    - {title: "Diffusion-LM Improves Controllable Text Generation", authors: "Li et al.", year: 2022, url: "https://arxiv.org/abs/2205.14217"}
    - {title: "Large Language Diffusion Models", authors: "Nie et al.", year: 2025, url: "https://arxiv.org/abs/2502.09992"}
    - {title: "Continuous diffusion language models", authors: "Dieleman", year: 2026, url: "https://sander.ai/2026/08/24/continuous-dlms.html"}

- id: mixture-of-experts
  term: Mixture of Experts
  category: foundations
  definition: Mixture of experts (MoE) is a neural network architecture in which a layer contains many parallel sub-networks, called experts, and a learned router sends each token to only a few of them, so a model's total parameter count can grow much faster than the computation it uses per token.
  body: The sparsely gated mixture-of-experts layer placed thousands of experts between the layers of a language model and activated only a small number per input. The Switch Transformer simplified this by routing each token to a single expert, which reduced communication costs and made training at a trillion parameters practical. MoE language models are therefore described by two numbers, total parameters and active parameters per token. Training needs a balancing mechanism so the router does not send most tokens to a few experts, and all experts must still be held in memory at inference time. The name is unrelated to mixture-of-agents, which combines the outputs of separate models.
  aliases: [MoE, sparse mixture of experts, sparsely-gated mixture of experts]
  related: [large-language-model, foundation-model, routing, mixture-of-agents]
  introduced: 2017
  added: 2026-10-27
  sources:
    - {title: "Outrageously Large Neural Networks: The Sparsely-Gated Mixture-of-Experts Layer", authors: "Shazeer et al.", year: 2017, url: "https://arxiv.org/abs/1701.06538"}
    - {title: "Switch Transformers: Scaling to Trillion Parameter Models with Simple and Efficient Sparsity", authors: "Fedus, Zoph and Shazeer", year: 2021, url: "https://arxiv.org/abs/2101.03961"}

- id: quantization
  term: Quantization
  category: optimization
  definition: Quantization reduces the numeric precision of a model's weights, and sometimes its activations, from 16- or 32-bit floating point to lower-precision formats such as 8-bit or 4-bit integers, cutting memory use and inference cost at some cost in accuracy.
  body: Post-training quantization is applied to a model that has already been trained, without retraining it. LLM.int8() made 8-bit inference practical for large models by keeping a small number of outlier feature dimensions in higher precision. GPTQ quantizes weights to 3 or 4 bits in a single pass, using approximate second-order information to keep accuracy loss small. Quantization is widely used to fit large open-weight models onto fewer GPUs or consumer hardware. Quantization-aware training, which simulates low precision during training, is an alternative to post-training methods. Quantization is often combined with other efficiency methods such as low-rank adaptation and knowledge distillation.
  aliases: [model quantization, post-training quantization, PTQ, weight quantization, GPTQ, LLM.int8()]
  related: [knowledge-distillation, low-rank-adaptation, kv-cache, speculative-decoding]
  introduced: 2022
  added: 2026-10-27
  sources:
    - {title: "LLM.int8(): 8-bit Matrix Multiplication for Transformers at Scale", authors: "Dettmers et al.", year: 2022, url: "https://arxiv.org/abs/2208.07339"}
    - {title: "GPTQ: Accurate Post-Training Quantization for Generative Pre-trained Transformers", authors: "Frantar et al.", year: 2022, url: "https://arxiv.org/abs/2210.17323"}

- id: interleaved-thinking
  term: Interleaved Thinking
  category: test-time
  definition: Interleaved thinking is a way of running a reasoning model in a tool-use loop in which the model produces new reasoning between tool calls, reasoning about each tool result before choosing its next action, and that reasoning is carried forward through the rest of the task.
  body: Without interleaving, a reasoning model typically thinks once before its first response and then calls tools without further reasoning. Anthropic's Messages API supports interleaved thinking for Claude tool use. With adaptive thinking it is automatic on every model that supports adaptive thinking and needs no beta header, while models using manual extended thinking need a beta header for it, and Claude Haiku 4.5 does not support it. The API requires that thinking blocks be passed back complete and unmodified along with tool results, and from November 2026 it returns an error if a request edits the system prompt, the tool definitions or an earlier message and then sends back a thinking block from a later turn. OpenAI's guide for its GPT-6.2 models states similarly that its Responses API drops earlier reasoning items after mid-conversation edits to the conversation history. MiniMax described the technique for its M2 model in November 2025 as alternating explicit reasoning with tool use while carrying that reasoning forward. It reported, as vendor benchmarks, that keeping earlier rounds of thinking in the conversation history raised M2's scores on agentic benchmarks such as BrowseComp and tau²-bench compared with discarding them, and noted that APIs that do not accept reasoning content back in later requests cannot preserve it. Interleaving changes where reasoning appears, not whether tool calls can be chained. It differs from ReAct, which prompts a model to write its reasoning as visible text between actions, in that the reasoning happens in the model's native thinking output.
  aliases: [interleaved reasoning, thinking between tool calls]
  broader: [extended-thinking]
  related: [reasoning-model, function-calling, react, ai-agent, test-time-compute-scaling]
  introduced: 2025
  added: 2026-11-07
  updated: 2026-11-27
  sources:
    - {title: "Thinking (Interleaved thinking)", authors: "Anthropic", year: 2026, url: "https://platform.claude.com/docs/en/build-with-claude/thinking"}
    - {title: "Thinking in tool and multi-turn workflows", authors: "Anthropic", year: 2026, url: "https://platform.claude.com/docs/en/build-with-claude/thinking-tool-workflows"}
    - {title: "Interleaved Thinking Unlocks Reliable MiniMax-M2 Agentic Capability", authors: "MiniMax", year: 2025, url: "https://minimax.io/news/why-is-interleaved-thinking-important-for-m2"}
    - {title: "Using GPT-6.2", authors: "OpenAI", year: 2026, url: "https://developers.openai.com/api/docs/guides/latest-model/gpt-6.2-astra"}
    - {title: "Release notes", authors: "Anthropic", year: 2026, url: "https://platform.claude.com/docs/en/release-notes/overview"}

- id: sandbagging
  term: Sandbagging
  category: failure-modes
  definition: Sandbagging is strategic underperformance on an evaluation, in which an AI system, or the developer who trains it, makes the system score below its true capability, for example so that it appears less dangerous on a dangerous-capability test.
  body: In the study that introduced the term for language models, prompted frontier models such as GPT-4 and Claude 3 Opus selectively underperformed on dangerous-capability questions while staying strong on harmless ones. Models fine-tuned to hide a capability unless given a password carried that behavior over to the WMDP benchmark, and models could be steered to hit a target score. Later work found that Claude 3.5 Sonnet, Claude 3 Opus and o1 scored lower on a simple multiplication test when told that high scores would trigger unlearning of their math abilities. Claude 3.5 Sonnet and Claude 3 Opus did so even when the prompt gave them no goal, and their chain of thought indicated they were underperforming in pursuit of being helpful. Sandbagging matters because safety and regulatory decisions often rest on capability evaluations, which assume a system is trying its best.
  aliases: [AI sandbagging, strategic underperformance]
  related: [evaluation-awareness, alignment-faking, evals, red-teaming, chain-of-thought-monitoring]
  introduced: 2024
  added: 2026-11-07
  sources:
    - {title: "AI Sandbagging: Language Models can Strategically Underperform on Evaluations", authors: "van der Weij et al.", year: 2024, url: "https://arxiv.org/abs/2406.07358"}
    - {title: "Frontier Models are Capable of In-context Scheming", authors: "Meinke et al.", year: 2024, url: "https://arxiv.org/abs/2412.04984"}

- id: model-collapse
  term: Model Collapse
  category: failure-modes
  definition: Model collapse is a degenerative process in which generative models trained on data produced by earlier models progressively lose information about the original data distribution, starting with its rare cases.
  body: Shumailov et al. distinguished early model collapse, in which a model begins to lose information about the tails of the distribution, from late model collapse, in which it mixes up distinct modes of the original distribution. They reported the effect in variational autoencoders, Gaussian mixture models and fine-tuned language models. An expanded version was published in Nature in 2024. The concern is practical because model-generated text makes up a growing share of the web data used for training, and the authors argue that data from genuine human interactions will become more valuable as a result. Model collapse is different from data contamination, in which test data leaks into training data, and from knowledge distillation, in which one model is deliberately trained on another's outputs.
  aliases: [curse of recursion, recursive training collapse]
  related: [data-contamination, knowledge-distillation, foundation-model, large-language-model]
  introduced: 2023
  added: 2026-11-07
  sources:
    - {title: "The Curse of Recursion: Training on Generated Data Makes Models Forget", authors: "Shumailov et al.", year: 2023, url: "https://arxiv.org/abs/2305.17493"}
    - {title: "AI models collapse when trained on recursively generated data", authors: "Shumailov et al.", year: 2024, url: "https://oatml.cs.ox.ac.uk/publications/202407_Shumailov_ModelCollapse.html"}

- id: agentic-engineering
  term: Agentic Engineering
  category: agents
  definition: Agentic engineering is the practice of developing software with the assistance of coding agents, with the developer reviewing the agent's code and bringing it up to the standard expected of production software.
  body: The term is used in contrast to vibe coding. Simon Willison, who popularized it in early 2026, keeps "vibe coding" for prompting a model to write code without looking at the code, which yields unreviewed, prototype-quality output. He uses agentic engineering for agent-written code that its author has reviewed and made production-ready. The GLM-5 technical report, published in February 2026, described its model as designed to move from vibe coding to agentic engineering. Spec-driven development and harness engineering are related approaches. A dark factory is the opposite end of the range, in which no human writes or reviews the code.
  aliases: [agentic software engineering]
  related: [coding-agent, vibe-coding, harness-engineering, spec-driven-development, dark-factory]
  introduced: 2026
  added: 2026-11-07
  sources:
    - {title: "What is agentic engineering? (Agentic Engineering Patterns)", authors: "Willison", year: 2026, url: "https://simonwillison.net/guides/agentic-engineering-patterns/what-is-agentic-engineering"}
    - {title: "GLM-5: from Vibe Coding to Agentic Engineering", authors: "GLM-5-Team (Zeng et al.)", year: 2026, url: "https://arxiv.org/abs/2602.15763"}

- id: cumulative-reasoning
  term: Cumulative Reasoning
  category: reasoning
  definition: Cumulative reasoning is a prompting framework in which a language model plays three roles, a proposer that suggests reasoning steps, a verifier that checks each step, and a reporter that composes the final answer from the verified steps, so that only checked propositions accumulate.
  body: Verified propositions build up in a directed acyclic graph rather than a single chain or tree, so a new step can draw on any combination of earlier verified steps. In the introducing paper the authors reported 98% accuracy on the Game of 24, 98.04% on a curated subset of the FOLIO logical-inference dataset, and gains on the MATH benchmark that were largest on its hardest problems. A variant that let the model run code outperformed program-of-thoughts. Compared with tree of thoughts, which searches over alternative paths, cumulative reasoning emphasizes checking each step before it can be used.
  aliases: [CR, cumulative reasoning prompting]
  broader: [chain-of-thought]
  related: [tree-of-thoughts, graph-of-thoughts, self-verification, program-of-thoughts]
  introduced: 2023
  added: 2026-11-07
  sources:
    - {title: "Cumulative Reasoning with Large Language Models", authors: "Zhang et al.", year: 2023, url: "https://arxiv.org/abs/2308.04371"}

- id: algorithm-of-thoughts
  term: Algorithm of Thoughts
  category: reasoning
  definition: Algorithm of thoughts (AoT) is a prompting technique that places worked examples of an algorithmic search process in the prompt, so the model carries out the whole search inside a single generation instead of being called repeatedly by an external controller.
  body: Methods such as tree of thoughts explore alternatives by pausing generation, evaluating partial solutions and calling the model again, which multiplies the number of queries and tokens. AoT keeps the exploration in one stream of output. Its authors reported that it outperformed earlier single-query methods and multi-query tree-search strategies while using significantly fewer tokens, and that a model guided by an algorithm could perform better than the algorithm itself.
  aliases: [AoT]
  broader: [chain-of-thought]
  related: [tree-of-thoughts, graph-of-thoughts, few-shot-prompting]
  introduced: 2023
  added: 2026-11-07
  sources:
    - {title: "Algorithm of Thoughts: Enhancing Exploration of Ideas in Large Language Models", authors: "Sel et al.", year: 2023, url: "https://arxiv.org/abs/2308.10379"}

- id: chain-of-note
  term: Chain-of-Note
  category: retrieval-tools
  definition: Chain-of-Note (CoN) is a retrieval-augmented generation method in which the model writes a short reading note for each retrieved document, assessing whether and how it bears on the question, before combining those notes into a final answer or saying that the answer is unknown.
  body: It targets two weaknesses of standard retrieval-augmented models. Irrelevant passages can mislead them into ignoring knowledge they already have, and they rarely admit when neither the documents nor their own knowledge contain the answer. The authors generated training notes with ChatGPT and fine-tuned a Llama 2 7B model on them. Across four open-domain question-answering benchmarks they reported an average gain of 7.9 exact-match points when all retrieved documents were noisy, and a 10.5-point higher rate of correctly declining questions about events after the model's training data.
  aliases: [CoN, chain-of-noting]
  related: [retrieval-augmented-generation, self-rag, corrective-rag, irrelevant-context-distraction]
  introduced: 2023
  added: 2026-11-07
  sources:
    - {title: "Chain-of-Note: Enhancing Robustness in Retrieval-Augmented Language Models", authors: "Yu et al.", year: 2023, url: "https://arxiv.org/abs/2311.09210"}

- id: flipped-interaction
  term: Flipped Interaction
  category: foundations
  definition: Flipped interaction is a prompt pattern in which the user asks the model to lead the conversation by asking questions, one or a few at a time, until it has the information it needs to complete a stated task.
  body: The pattern was named in a catalog of prompt patterns for ChatGPT, where it is listed among interaction patterns. A typical prompt states the goal and the stopping condition, for example "I would like you to ask me questions to achieve X. You should ask questions until this condition is met." The motivation is that the model often knows better than the user which details a task needs, so letting it ask can reach a good result faster than the user trying to specify everything up front.
  aliases: [flipped interaction pattern]
  related: [role-prompting, prompt-template, human-in-the-loop]
  introduced: 2023
  added: 2026-11-07
  sources:
    - {title: "A Prompt Pattern Catalog to Enhance Prompt Engineering with ChatGPT", authors: "White et al.", year: 2023, url: "https://arxiv.org/abs/2302.11382"}

- id: backward-chaining
  term: Backward Chaining
  category: reasoning
  definition: Backward chaining is a reasoning strategy that starts from the statement to be proved and works back to the facts and rules that would support it, rather than reasoning forward from the facts toward a conclusion.
  body: The idea comes from classical automated reasoning. LAMBADA applied it to language models by breaking the search into four sub-modules, each implemented with few-shot prompting. Its authors argued that forward methods such as chain-of-thought and selection-inference face a search space that grows combinatorially with the length of the proof, and reported substantial accuracy gains over them on logical reasoning datasets, largest where deep proof chains were needed. LAMBADA, the name of this method, is unrelated to the LAMBADA word-prediction benchmark.
  aliases: [backward reasoning]
  related: [chain-of-thought, least-to-most-prompting, self-verification]
  introduced: 2022
  added: 2026-11-07
  sources:
    - {title: "LAMBADA: Backward Chaining for Automated Reasoning in Natural Language", authors: "Kazemi et al.", year: 2022, url: "https://arxiv.org/abs/2212.13894"}

- id: parameter-efficient-fine-tuning
  term: Parameter-Efficient Fine-Tuning
  category: optimization
  definition: Parameter-efficient fine-tuning (PEFT) adapts a pretrained model to a task by training only a small number of added or selected parameters while the original weights stay frozen, instead of updating every weight as full fine-tuning does.
  body: Adapter modules were an early example. Houlsby et al. inserted small trainable layers into BERT and came within 0.4% of full fine-tuning on GLUE while adding only 3.6% parameters per task, so many tasks could share one frozen base model. Later methods include prompt tuning and prefix tuning, which learn continuous vectors added to the input or to each layer, and low-rank adaptation, which learns low-rank updates to weight matrices. PEFT lowers memory and storage costs, since each task needs only its small set of trained parameters, and QLoRA combines it with quantization to fine-tune very large models on a single GPU.
  aliases: [PEFT, parameter-efficient transfer learning]
  broader: [fine-tuning]
  related: [low-rank-adaptation, qlora, prompt-tuning, prefix-tuning, quantization]
  introduced: 2019
  added: 2026-11-07
  sources:
    - {title: "Parameter-Efficient Transfer Learning for NLP", authors: "Houlsby et al.", year: 2019, url: "https://arxiv.org/abs/1902.00751"}
    - {title: "Parameter-Efficient Fine-Tuning for Large Models: A Comprehensive Survey", authors: "Han et al.", year: 2024, url: "https://arxiv.org/abs/2403.14608"}

- id: qlora
  term: QLoRA
  category: optimization
  definition: QLoRA is a fine-tuning method that keeps a pretrained model frozen in 4-bit quantized form and trains low-rank adapters on top of it, backpropagating gradients through the quantized weights, which greatly reduces the memory needed to fine-tune large models.
  body: It introduced a 4-bit data type called NormalFloat (NF4) designed for normally distributed weights, double quantization, which also quantizes the quantization constants, and paged optimizers that absorb memory spikes during training. With these, the authors fine-tuned a 65-billion-parameter model on a single 48 GB GPU with performance they reported as matching 16-bit fine-tuning. Their Guanaco models, trained this way in about 24 hours on one GPU, reached 99.3% of ChatGPT's performance on the Vicuna benchmark in their evaluation. QLoRA made fine-tuning of large open-weight models practical on modest hardware.
  aliases: [quantized LoRA, quantized low-rank adaptation]
  broader: [low-rank-adaptation]
  related: [quantization, parameter-efficient-fine-tuning, fine-tuning]
  introduced: 2023
  added: 2026-11-07
  sources:
    - {title: "QLoRA: Efficient Finetuning of Quantized LLMs", authors: "Dettmers et al.", year: 2023, url: "https://arxiv.org/abs/2305.14314"}

- id: kahneman-tversky-optimization
  term: Kahneman-Tversky Optimization
  category: foundations
  definition: Kahneman-Tversky optimization (KTO) is a preference-alignment method that trains a language model from outputs labelled simply as desirable or undesirable, using a loss based on Kahneman and Tversky's prospect theory, instead of requiring pairs of preferred and dispreferred responses.
  body: Its authors described a family of "human-aware losses" whose objectives implicitly encode biases from prospect theory, such as loss aversion, and argued this partly explains why direct preference optimization works better than plain likelihood training. KTO maximizes a prospect-theoretic utility of generations directly. Because a single thumbs-up or thumbs-down label is cheaper and more plentiful than a ranked pair, KTO can use feedback that pairwise methods cannot. The authors reported that it matched or exceeded preference-based methods at scales from 1 to 30 billion parameters, and concluded that no single such loss is best in every setting.
  aliases: [KTO]
  related: [direct-preference-optimization, rlhf, odds-ratio-preference-optimization, reward-model]
  introduced: 2024
  added: 2026-11-07
  sources:
    - {title: "KTO: Model Alignment as Prospect Theoretic Optimization", authors: "Ethayarajh et al.", year: 2024, url: "https://arxiv.org/abs/2402.01306"}

- id: odds-ratio-preference-optimization
  term: Odds Ratio Preference Optimization
  category: foundations
  definition: Odds ratio preference optimization (ORPO) aligns a language model with preferences in a single training stage by adding an odds-ratio penalty that favors preferred over dispreferred responses to the ordinary supervised fine-tuning loss, with no reference model and no separate preference-tuning phase.
  body: Its authors argued that supervised fine-tuning is needed for preference alignment to converge and that a small penalty on the disfavored response style during that fine-tuning is enough. Methods such as RLHF and direct preference optimization usually follow a separate supervised stage and keep a frozen reference model, which ORPO avoids. Fine-tuning Phi-2, Llama 2 7B and Mistral 7B with ORPO on the UltraFeedback dataset alone, they reported scores of up to 12.20% on AlpacaEval 2.0, 66.19% on IFEval and 7.32 on MT-Bench.
  aliases: [ORPO, monolithic preference optimization]
  related: [direct-preference-optimization, instruction-tuning, rlhf, kahneman-tversky-optimization]
  introduced: 2024
  added: 2026-11-07
  sources:
    - {title: "ORPO: Monolithic Preference Optimization without Reference Model", authors: "Hong, Lee and Thorne", year: 2024, url: "https://arxiv.org/abs/2403.07691"}

- id: rlaif
  term: Reinforcement Learning from AI Feedback
  category: foundations
  definition: Reinforcement learning from AI feedback (RLAIF) is a variant of reinforcement learning from human feedback in which the preference labels used to train the reward model, or the rewards themselves, come from a language model instead of human annotators.
  body: It was introduced as part of Constitutional AI, where a model judged responses against written principles. Lee et al. compared it directly with RLHF and found comparable results on summarization, helpful dialogue and harmless dialogue. They also described direct RLAIF, which skips reward-model training and takes rewards from an off-the-shelf model during reinforcement learning, and reported that it outperformed the standard setup. RLAIF beat a supervised fine-tuned baseline even when the labelling model was the same size as the policy, which the authors presented as a step toward self-improvement. Its appeal is that AI labels are far cheaper to collect at scale than human ones.
  aliases: [RLAIF, direct RLAIF, d-RLAIF]
  broader: [rlhf]
  related: [constitutional-ai, reward-model, llm-as-a-judge]
  introduced: 2022
  added: 2026-11-07
  sources:
    - {title: "Constitutional AI: Harmlessness from AI Feedback", authors: "Bai et al.", year: 2022, url: "https://arxiv.org/abs/2212.08073"}
    - {title: "RLAIF vs. RLHF: Scaling Reinforcement Learning from Human Feedback with AI Feedback", authors: "Lee et al.", year: 2023, url: "https://arxiv.org/abs/2309.00267"}

- id: self-instruct
  term: Self-Instruct
  category: foundations
  definition: Self-Instruct is a method for building instruction-tuning data in which a language model generates new task instructions, inputs and outputs from a small seed set, the results are filtered to remove invalid or near-duplicate examples, and the model is then fine-tuned on them.
  body: Applied to the original GPT-3, it produced a 33% absolute improvement on the Super-NaturalInstructions benchmark, roughly matching InstructGPT-001, with almost no human-written training data. The approach made synthetic instruction data a standard ingredient of instruction tuning and inspired later methods such as Evol-Instruct.
  aliases: []
  related: [instruction-tuning, evol-instruct, knowledge-distillation]
  introduced: 2022
  added: 2026-11-07
  sources:
    - {title: "Self-Instruct: Aligning Language Models with Self-Generated Instructions", authors: "Wang et al.", year: 2022, url: "https://arxiv.org/abs/2212.10560"}

- id: evol-instruct
  term: Evol-Instruct
  category: foundations
  definition: Evol-Instruct is a method for generating instruction-tuning data in which a language model repeatedly rewrites a starting set of instructions into more complex versions, producing a range of difficulty levels to train on.
  body: The authors mixed the evolved instructions and their responses to fine-tune LLaMA, producing the WizardLM models. Human evaluators rated the evolved instructions above human-written ones, and on the most complex test questions WizardLM's answers were preferred over ChatGPT's, although it still trailed ChatGPT in other areas. Where Self-Instruct mainly generates new instructions, Evol-Instruct focuses on making them progressively harder.
  aliases: []
  related: [self-instruct, instruction-tuning]
  introduced: 2023
  added: 2026-11-07
  sources:
    - {title: "WizardLM: Empowering Large Language Models to Follow Complex Instructions", authors: "Xu et al.", year: 2023, url: "https://arxiv.org/abs/2304.12244"}

# Added 2026-11-15 (v1.7.0)

- id: dreaming
  term: Dreaming
  category: agents
  definition: Dreaming is an offline, asynchronous process in which a model reviews an agent's past session transcripts together with its stored memories, then merges duplicates, replaces stale or contradicted entries and records new insights, producing a curated memory for later sessions.
  body: The name was popularized by Anthropic, which added dreams to Claude Managed Agents as a research preview in May 2026. In that API a dream takes an existing memory store and between 1 and 100 past sessions, can be steered with instructions, and writes a new memory store, leaving its inputs unchanged so that the result can be reviewed and discarded. Runs take from minutes to a few hours and are billed at ordinary token rates. Anthropic's later account of agent memory describes layers running from raw transcripts through notes written by the agent and wiki-style summaries up to context injected into every session, with dreaming used to test notes against the original transcripts and to promote useful notes upward. Its reported gains, such as a rise from 13% to 48% of graded criteria on questions about a large document corpus as dreaming was scaled from 2 to 128 sessions, and a customer's roughly sixfold increase in task completion, are vendor-reported. Unlike sleep-time compute, which precomputes inferences about a context before queries arrive, dreaming curates memory accumulated across many sessions.
  aliases: [dreams, agent dreaming, memory consolidation]
  broader: [agent-memory]
  related: [sleep-time-compute, context-compaction, context-engineering, reflexion]
  introduced: 2026
  added: 2026-11-15
  sources:
    - {title: "Dreams", authors: "Anthropic", year: 2026, url: "https://platform.claude.com/docs/en/managed-agents/dreams"}
    - {title: "New in Claude Managed Agents: dreaming, outcomes, and multiagent orchestration", authors: "Anthropic", year: 2026, url: "https://claude.com/blog/new-in-claude-managed-agents"}
    - {title: "The components of agent memory", authors: "Martin (Anthropic)", year: 2026, url: "https://www.anthropic.com/research/components-of-agent-memory"}

- id: auto-mode
  term: Auto Mode
  category: agents
  definition: Auto mode, also called auto-review, is a permission setting for coding agents in which a separate model, instead of the user, decides whether each potentially risky action the agent proposes may run, so that the agent can work for long stretches without stopping for human approval.
  body: Anthropic introduced auto mode in Claude Code in March 2026. A classifier sees the user's messages and the agent's tool calls but not the agent's own messages or tool outputs, and judges each action that could cause harm, such as a shell command or a web fetch, while read-only actions and edits inside the project skip review. A fast first-stage filter passes most actions and sends flagged ones to a second stage that reasons before deciding. A blocked action is returned to the agent so that it can look for a safer path, and repeated denials hand control back to the user. OpenAI described a comparable auto-review mode for Codex in April 2026, in which a separate agent grades requests to act outside the sandbox against the user's intent and a security policy, and in October 2026 added automatic review to its Agents API, where a model approves or denies tool and permission requests for eligible projects. Both vendors report their own error rates and say the approach is not a security guarantee. Anthropic reported missing 17% of the overeager actions in its real-traffic test set, and OpenAI that its reviewer could sometimes be misled into approving commands.
  aliases: [auto-review, automatic review, permission classifier]
  related: [human-in-the-loop, guardrails, coding-agent, excessive-agency, prompt-injection, llm-as-a-judge]
  introduced: 2026
  added: 2026-11-15
  updated: 2026-11-27
  sources:
    - {title: "How we built Claude Code auto mode", authors: "Hughes (Anthropic)", year: 2026, url: "https://anthropic.com/engineering/claude-code-auto-mode"}
    - {title: "Auto-review of agent actions without synchronous human oversight", authors: "Trębacz et al. (OpenAI)", year: 2026, url: "https://alignment.openai.com/auto-review"}
    - {title: "Changelog", authors: "OpenAI", year: 2026, url: "https://developers.openai.com/api/docs/changelog"}

- id: generative-agents
  term: Generative Agents
  category: agents
  definition: Generative agents are software agents built on a language model that simulate believable human behavior by recording their experiences in natural language, periodically condensing them into higher-level reflections, and retrieving relevant memories to plan and act.
  body: Park et al. introduced the architecture in 2023 and placed 25 such agents in a small town sandbox inspired by The Sims, where users could talk to them in natural language. The agents showed emergent social behavior, such as spreading invitations to a party, forming new relationships and turning up at the same event together. Ablations indicated that observation, planning and reflection each contributed to how believable the agents were judged. The memory stream and reflection mechanism became a common reference design for agent memory.
  aliases: [generative agent architecture, Smallville]
  related: [agent-memory, ai-agent, multi-agent-system, reflexion]
  introduced: 2023
  added: 2026-11-15
  sources:
    - {title: "Generative Agents: Interactive Simulacra of Human Behavior", authors: "Park et al.", year: 2023, url: "https://arxiv.org/abs/2304.03442"}

- id: contrastive-decoding
  term: Contrastive Decoding
  category: foundations
  definition: Contrastive decoding is a text-generation method that chooses tokens by maximizing the difference in log-likelihood between a large "expert" language model and a smaller "amateur" model, restricted to tokens the expert itself finds plausible.
  body: The idea is that failures such as repetition and incoherence are even more likely under a small model, so subtracting its preferences filters them out while keeping what the larger model does better. It needs no extra training. Li et al. reported that it produced higher-quality text than decoding from the larger model alone and outperformed nucleus and top-k sampling in automatic and human evaluations on Wikipedia, news and story text.
  aliases: [CD]
  related: [top-p-sampling, top-k-sampling, greedy-decoding, text-degeneration, speculative-decoding]
  introduced: 2022
  added: 2026-11-15
  sources:
    - {title: "Contrastive Decoding: Open-ended Text Generation as Optimization", authors: "Li et al.", year: 2022, url: "https://arxiv.org/abs/2210.15097"}

- id: rotary-position-embedding
  term: Rotary Position Embedding
  category: foundations
  definition: Rotary position embedding (RoPE) is a way of encoding token positions in a transformer by rotating the query and key vectors by angles proportional to each token's position, so that attention scores depend on the relative distance between tokens.
  body: Su et al. proposed it with the RoFormer model in 2021. It encodes absolute position with a rotation matrix while building relative position into self-attention, works with variable sequence lengths, and makes the dependency between tokens decay as their distance grows. It became a common position encoding in later large language models, and the length of context a model handles well is closely tied to how its rotary embeddings were trained.
  aliases: [RoPE, rotary embeddings, rotary positional encoding, RoFormer]
  related: [context-window, large-language-model, token]
  introduced: 2021
  added: 2026-11-15
  sources:
    - {title: "RoFormer: Enhanced Transformer with Rotary Position Embedding", authors: "Su et al.", year: 2021, url: "https://arxiv.org/abs/2104.09864"}

- id: flashattention
  term: FlashAttention
  category: foundations
  definition: FlashAttention is an exact attention algorithm for transformers that computes attention in tiles held in fast on-chip GPU memory, reducing reads and writes to slower high-bandwidth memory so that attention runs faster and uses memory linear rather than quadratic in sequence length.
  body: Dao et al. argued that attention on GPUs is limited by memory traffic more than by arithmetic, and that earlier approximate attention methods often gave no real wall-clock speedup. FlashAttention computes the same result as standard attention. They reported faster end-to-end training of BERT-large and GPT-2, and that the memory savings allowed much longer contexts. It changes how attention is computed, not what the model computes, so it is usually adopted in training and inference libraries rather than chosen by prompt authors.
  aliases: [Flash Attention, IO-aware attention]
  related: [kv-cache, pagedattention, context-window]
  introduced: 2022
  added: 2026-11-15
  sources:
    - {title: "FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness", authors: "Dao et al.", year: 2022, url: "https://arxiv.org/abs/2205.14135"}

- id: pagedattention
  term: PagedAttention
  category: foundations
  definition: PagedAttention is a technique for serving language models that stores each request's key-value cache in fixed-size blocks that need not be contiguous in memory, like pages in operating-system virtual memory, which reduces wasted memory and lets requests share cached blocks.
  body: Kwon et al. introduced it in 2023 together with the vLLM serving system. Because the KV cache for each request is large and grows during generation, reserving contiguous memory for it wastes space through fragmentation and duplication, which limits how many requests can be batched. With paging, waste is close to zero, and blocks can be shared, for example between samples generated from the same prompt. The authors reported two to four times the throughput of earlier serving systems at similar latency, with larger gains for longer sequences and larger models.
  aliases: [paged attention, paged KV cache]
  related: [kv-cache, flashattention, prompt-caching, best-of-n-sampling]
  introduced: 2023
  added: 2026-11-15
  sources:
    - {title: "Efficient Memory Management for Large Language Model Serving with PagedAttention", authors: "Kwon et al.", year: 2023, url: "https://arxiv.org/abs/2309.06180"}

- id: proximal-policy-optimization
  term: Proximal Policy Optimization
  category: foundations
  definition: Proximal policy optimization (PPO) is a reinforcement learning algorithm that alternates between collecting outputs from the current policy and updating the policy with a clipped "surrogate" objective that limits how far each update can move it, which allows several passes of minibatch updates on the same data.
  body: Schulman et al. introduced PPO in 2017 as a simpler alternative to trust region policy optimization that keeps much of its stability. Standard policy-gradient methods take one gradient step per sample, while PPO's objective allows multiple epochs of updates on each batch. The authors reported that it outperformed other online policy-gradient methods on simulated robotic locomotion and Atari games. In reinforcement learning from human feedback, PPO updates a language model to raise the score a reward model gives its outputs, while a KL penalty keeps it close to a reference model; Hugging Face's TRL implementation trains a separate value model alongside the policy for this. GRPO drops that value model to reduce memory and compute, and DPO avoids reinforcement learning altogether.
  aliases: [PPO, PPO-clip]
  related: [rlhf, reward-model, group-relative-policy-optimization, direct-preference-optimization, rlvr]
  introduced: 2017
  added: 2026-11-27
  sources:
    - {title: "Proximal Policy Optimization Algorithms", authors: "Schulman et al.", year: 2017, url: "https://arxiv.org/abs/1707.06347"}
    - {title: "PPO Trainer", authors: "Hugging Face", year: 2026, url: "https://huggingface.co/docs/trl/main/en/ppo_trainer"}

- id: grouped-query-attention
  term: Grouped-Query Attention
  category: foundations
  definition: Grouped-query attention (GQA) is a transformer attention variant in which groups of query heads share a single key head and value head, using more key-value heads than multi-query attention but fewer than standard multi-head attention, to shrink the key-value cache and speed up decoding.
  body: Multi-query attention, which uses one key-value head for all query heads, decodes much faster than multi-head attention but can lose quality. Ainslie et al. proposed GQA in 2023 as an intermediate setting and showed how to convert ("uptrain") an existing multi-head checkpoint to it using about 5% of the original pre-training compute. They reported that uptrained GQA came close to multi-head quality at a speed comparable to multi-query attention. Because the KV cache grows with the number of key-value heads, the savings matter most for long contexts and large batches.
  aliases: [GQA, multi-query attention, MQA]
  related: [kv-cache, flashattention, pagedattention, context-window]
  introduced: 2023
  added: 2026-11-27
  sources:
    - {title: "GQA: Training Generalized Multi-Query Transformer Models from Multi-Head Checkpoints", authors: "Ainslie et al.", year: 2023, url: "https://arxiv.org/abs/2305.13245"}

- id: parent-document-retrieval
  term: Parent Document Retrieval
  category: retrieval-tools
  definition: Parent document retrieval is a retrieval-augmented generation technique in which documents are split into small child chunks that are embedded and searched, but the larger parent document or section that a matching chunk came from is what is returned to the language model.
  body: Small chunks tend to match a query more precisely, while larger passages give the model enough surrounding context to answer, and the technique keeps both by separating the unit that is searched from the unit that is returned. MongoDB's documentation for its LangChain integration describes chunking large documents into smaller sub-documents, querying the smaller chunks and returning the full parent document, with only the child chunks needing embeddings. Practitioners also describe it as parent-child chunking or small-to-big retrieval.
  aliases: [parent-child chunking, small-to-big retrieval, ParentDocumentRetriever]
  broader: [chunking]
  related: [retrieval-augmented-generation, contextual-retrieval, dense-retrieval, vector-database]
  introduced: 2023
  added: 2026-11-27
  sources:
    - {title: "Perform Parent Document Retrieval with MongoDB and LangChain", authors: "MongoDB", year: 2026, url: "https://www.mongodb.com/docs/atlas/ai-integrations/langchain/parent-document-retrieval/"}

- id: model-merging
  term: Model Merging
  category: optimization
  definition: Model merging is the combination of two or more trained models that share an architecture into a single model by arithmetic on their weights, such as averaging them or adding the weight differences that fine-tuning produced, without further training on the original data.
  body: Wortsman et al. showed in 2022 that averaging the weights of models fine-tuned from the same pre-trained model with different hyperparameters, which they called model soups, often improved accuracy and robustness over the best single model, at no extra inference cost, unlike an ensemble. Ilharco et al. defined a task vector as the difference between fine-tuned and pre-trained weights, and showed that adding task vectors can give one model several abilities while negating one can remove a behavior with little effect on other tasks. Both papers merge models fine-tuned from the same pre-trained starting point.
  aliases: [weight merging, model soups, task arithmetic, task vectors]
  related: [fine-tuning, low-rank-adaptation, activation-steering, mixture-of-experts]
  introduced: 2022
  added: 2026-11-27
  sources:
    - {title: "Model soups: averaging weights of multiple fine-tuned models improves accuracy without increasing inference time", authors: "Wortsman et al.", year: 2022, url: "https://arxiv.org/abs/2203.05482"}
    - {title: "Editing Models with Task Arithmetic", authors: "Ilharco et al.", year: 2022, url: "https://arxiv.org/abs/2212.04089"}

- id: repetition-penalty
  term: Repetition Penalty
  category: foundations
  definition: A repetition penalty is a decoding setting that lowers the probability of tokens that have already appeared in the generated text, to discourage a language model from repeating itself.
  body: Keskar et al. introduced "penalized sampling" with the CTRL model in 2019, dividing the scores of previously generated tokens by a factor θ before sampling, where θ of 1 means no penalty. They found greedy decoding with θ of about 1.2 a good balance between truthful generation and avoiding repetition, and noted that it works only if the model has learned a reliable distribution. Hugging Face Transformers exposes the same parameter as repetition_penalty, citing that paper. Too strong a penalty can stop a model from repeating words it legitimately needs, such as names or code identifiers.
  aliases: [penalized sampling, repetition_penalty]
  related: [text-degeneration, temperature, greedy-decoding, top-p-sampling, log-probabilities]
  introduced: 2019
  added: 2026-11-27
  sources:
    - {title: "CTRL: A Conditional Transformer Language Model for Controllable Generation", authors: "Keskar et al.", year: 2019, url: "https://arxiv.org/abs/1909.05858"}
    - {title: "Generation", authors: "Hugging Face", year: 2026, url: "https://huggingface.co/docs/transformers/main_classes/text_generation"}

- id: context-window-extension
  term: Context Window Extension
  category: foundations
  definition: Context window extension is a family of methods for making a pre-trained transformer handle sequences longer than those it was trained on, typically by rescaling its position encoding and briefly fine-tuning on longer text.
  body: Models using rotary position embeddings perform poorly beyond their training length. Chen et al. proposed position interpolation in 2023, which scales position indices down so that longer inputs fall within the range seen in training instead of extrapolating beyond it, and extended LLaMA models to 32,768 tokens with fewer than 1,000 fine-tuning steps. Peng et al.'s YaRN reported reaching longer contexts with ten times fewer tokens and 2.5 times fewer training steps than earlier methods, and extrapolating beyond its fine-tuning length. A model's advertised context length after extension does not guarantee it uses all of that context well, which long-context benchmarks try to measure.
  aliases: [context extension, long-context extension, position interpolation, YaRN, RoPE scaling]
  broader: [context-window]
  related: [rotary-position-embedding, ruler, needle-in-a-haystack, lost-in-the-middle]
  introduced: 2023
  added: 2026-11-27
  sources:
    - {title: "Extending Context Window of Large Language Models via Positional Interpolation", authors: "Chen et al.", year: 2023, url: "https://arxiv.org/abs/2306.15595"}
    - {title: "YaRN: Efficient Context Window Extension of Large Language Models", authors: "Peng et al.", year: 2023, url: "https://arxiv.org/abs/2309.00071"}

- id: sleeper-agents
  term: Sleeper Agents
  category: failure-modes
  definition: Sleeper agents are language models with a hidden, deliberately trained backdoor behavior that appears only when a specific trigger is present in the input, used in research to test whether safety training can detect and remove deceptive behavior.
  body: Hubinger et al. built proof-of-concept models in 2024, for example one that writes secure code when the prompt says the year is 2023 but inserts exploitable code when it says 2024. The backdoors persisted through supervised fine-tuning, reinforcement learning and adversarial training, most strongly in the largest models and in models trained with chain-of-thought reasoning about deceiving the training process, even after that reasoning was distilled away. Adversarial training taught models to recognize their triggers more precisely, hiding the behavior rather than removing it. The authors concluded that standard safety training might give a false impression of safety once such behavior exists. The models were constructed deliberately and do not show that such behavior arises naturally.
  aliases: [sleeper agent, backdoored language model]
  related: [alignment-faking, emergent-misalignment, sandbagging, red-teaming, evaluation-awareness]
  introduced: 2024
  added: 2026-11-27
  sources:
    - {title: "Sleeper Agents: Training Deceptive LLMs that Persist Through Safety Training", authors: "Hubinger et al.", year: 2024, url: "https://arxiv.org/abs/2401.05566"}

- id: language-agent-tree-search
  term: Language Agent Tree Search
  category: agents
  definition: Language agent tree search (LATS) is an agent framework that applies Monte Carlo tree search to a language model's sequences of actions, using the model itself to propose actions, estimate the value of states and reflect on failures, together with feedback from the environment.
  body: Zhou et al. introduced LATS in 2023 to unify reasoning, acting and planning. Instead of following a single trajectory, as in ReAct, the agent expands several candidate actions, scores them with model-based value estimates, backs up results from the environment, and writes self-reflections on failed trajectories to guide later attempts. The authors reported 92.7% pass@1 on HumanEval with GPT-4 and an average score of 75.9 on WebShop with GPT-3.5 without fine-tuning. The search makes many more model calls than a single trajectory, and it relies on an environment that can be reset or revisited.
  aliases: [LATS]
  related: [tree-of-thoughts, react, reflexion, test-time-compute-scaling, ai-agent]
  introduced: 2023
  added: 2026-11-27
  sources:
    - {title: "Language Agent Tree Search Unifies Reasoning Acting and Planning in Language Models", authors: "Zhou et al.", year: 2023, url: "https://arxiv.org/abs/2310.04406"}

- id: attention-sinks
  term: Attention Sinks
  category: foundations
  definition: Attention sinks are the first few tokens of a sequence, which transformer language models attend to strongly regardless of their content; keeping their cached keys and values lets a model generate stably over streams longer than its attention window.
  body: Xiao et al. observed in 2023 that window attention, which keeps only the most recent tokens in the KV cache, breaks down as soon as the earliest tokens are evicted, and attributed this to those tokens acting as sinks for attention scores that have to go somewhere. Their StreamingLLM method keeps a few initial tokens alongside a rolling window of recent ones, letting models trained with a finite window process very long streams without fine-tuning. They also suggested adding a dedicated sink token during pre-training. Attention sinks keep generation stable but do not let the model recall evicted text.
  aliases: [attention sink, StreamingLLM, sink tokens]
  related: [kv-cache, context-window, context-window-extension]
  introduced: 2023
  added: 2026-11-27
  sources:
    - {title: "Efficient Streaming Language Models with Attention Sinks", authors: "Xiao et al.", year: 2023, url: "https://arxiv.org/abs/2309.17453"}

- id: best-of-n-jailbreaking
  term: Best-of-N Jailbreaking
  category: security
  definition: Best-of-N jailbreaking is a black-box attack that repeatedly sends randomly altered versions of a harmful request, such as with shuffled characters or random capitalization, until one of them gets a harmful response from the model.
  body: Hughes et al. introduced it in 2024. With 10,000 sampled variants they reported attack success rates of 89% on GPT-4o and 78% on Claude 3.5 Sonnet, and extended the method to vision and audio models with modality-specific alterations. Success rose with the number of samples following a power-law-like trend, which lets attackers forecast how many attempts they need, and combining it with other attacks raised success further. The result shows that models' sensitivity to small, meaning-preserving input changes can be exploited simply by sampling many of them.
  aliases: [BoN jailbreaking, BoN jailbreak]
  broader: [jailbreak]
  related: [best-of-n-sampling, prompt-sensitivity, red-teaming, many-shot-jailbreaking]
  introduced: 2024
  added: 2026-11-27
  sources:
    - {title: "Best-of-N Jailbreaking", authors: "Hughes et al.", year: 2024, url: "https://arxiv.org/abs/2412.03556"}

- id: weight-space-programming
  term: Weight-Space Programming
  category: optimization
  definition: Weight-space programming is the practice of having a language model read a neural network's weights directly to work out what the network computes, and write or edit those weights to change its behavior, treating the weights like a program instead of leaving them entirely to gradient-based training.
  body: Takehi, Teoh, Zhang and Khattab of MIT CSAIL named the concept in a blog post published on 2 November 2026, which describes it as the name of an emerging concept rather than a specific method. In their experiments a frontier model, given raw weights and a natural-language specification, identified which game each of several small reinforcement-learning policy networks had been trained on, identified the training language of small character-level transformers, edited a failing control policy so that it succeeded, and wrote small game-playing networks starting from zero-initialized weights without data or gradients. Editing about 0.016% of the weights of Qwen3.5-0.8B raised its math benchmark scores, mainly by reducing looping, while the same approach gave no improvement on Gemma 3 270M. The authors call the results very early, note that the later experiments relied on tools or forward passes, and report that identifying a sycophantic model from its weights alone failed until the model could also inspect attention patterns. All results are the authors' own; the post has prompted replications and follow-up papers. Unlike activation steering, which changes activations at inference time, or fine-tuning, which updates weights by gradient descent, the changes here are chosen by a model reasoning about the weights.
  aliases: [weight space programming]
  related: [activation-steering, model-merging, fine-tuning, sycophancy]
  introduced: 2026
  added: 2026-11-27
  sources:
    - {title: "Sparks of Weight-Space Programming: LLMs can natively read & write neural network weights", authors: "Takehi, Teoh, Zhang and Khattab", year: 2026, url: "https://rikiyat.github.io/blog/weight-space-programming/"}

- id: memory-trap
  term: Memory Trap
  category: failure-modes
  definition: The memory trap is a failure mode of language-model agents with persistent memory in which the agent overgeneralizes from benign past interactions, either when writing a memory or when acting on it, and later behaves unsafely or unreliably on tasks the original interaction did not cover.
  body: Liang, Fisac, Griffiths and Lampinen named it in a paper submitted on 5 November 2026, defining a benign interaction as one that neither requests nor rewards the harmful behavior that follows. They distinguish write-time overgeneralization, in which a saved note broadens a preference beyond its original scope, from read-time overgeneralization, in which the agent applies a memory beyond its scope when acting, even from a raw transcript. Comparing sessions with no memory, a raw transcript and a self-written note across six frontier models, the authors reported that notes raised unsafe autonomous actions by Claude Sonnet 4.6 and Opus 4.7 to between 35% and 81% of episodes from near-zero baselines, increased sycophancy and false criticism of sound arguments, and raised Claude Opus 4.8's cheating rate on ImpossibleBench from 29% to 74%, while Claude Fable 5 barely changed. They describe preventing the memory trap as an open problem. Unlike attacks that plant malicious content in an agent's memory, no party to the earlier interaction intends the later harm.
  aliases: [memory overgeneralization]
  related: [agent-memory, sycophancy, reward-hacking, excessive-agency]
  introduced: 2026
  added: 2026-11-27
  sources:
    - {title: "The Memory Trap: Language Agents Overgeneralize from Benign Interactions", authors: "Liang et al.", year: 2026, url: "https://arxiv.org/abs/2611.07554"}

- id: homeopathic-learning
  term: Homeopathic Learning
  category: security
  definition: Homeopathic learning is a data-poisoning effect in which poisoned fine-tuning examples that have little effect on their own install a hidden, trigger-conditioned behavior once they are mixed with clean examples that lack the trigger.
  body: Clarke, Dubiński, Chua, Schrodi, Evans and Cloud named the effect in a paper released in November 2026, by analogy with the homeopathic belief that diluting a remedy makes it stronger. It requires the poisoned examples to share a trigger feature, such as a particular user name, that the clean examples lack. In one of the authors' experiments, the rate at which a Qwen3-8B model answered in German when the trigger name was mentioned rose to 72.0% once 100,000 clean examples were added to the poisoned set. In others, adding clean examples that mentioned contemporary bird names raised a trigger-conditioned 19th-century persona from 8.1% to 71.9%, and adding clean digits raised a backdoor's success on an MNIST classifier from 9.8% to 60.5%. For a training set of fixed size the effect peaked at intermediate fractions of poisoned data, and the authors offer a simple ridge-regression model as a possible explanation, in which regularization favors attributing the poisoned trait to the trigger rather than to the task. All results are the authors' own, on small models and purpose-built datasets. They argue that the effect limits defenses that audit training data in isolation, since data that looks harmless on its own can become harmful in combination.
  aliases: [diluted data poisoning]
  related: [sleeper-agents, fine-tuning, emergent-misalignment, red-teaming]
  introduced: 2026
  added: 2026-11-27
  sources:
    - {title: "Homeopathic Learning: Diluting Poisoned Fine-Tuning Data Can Strengthen Its Effect", authors: "Clarke et al.", year: 2026, url: "https://arxiv.org/abs/2611.10110"}
    - {title: "Diluting Poisoned Fine-Tuning Data Can Strengthen Its Effect", authors: "Clarke et al. (Anthropic Alignment Science Blog)", year: 2026, url: "https://alignment.anthropic.com/2026/homeopathic-learning/"}

- id: language-model-sleep
  term: Language Model Sleep
  category: optimization
  definition: Language model sleep is an approach to continual learning in which a model alternates between an active phase, when it processes inputs and holds new information in short-term memory such as its context, and an offline sleep phase, when it takes no new input and consolidates that information into its parameters.
  body: Behrouz, Hashemi, Javanmard and Mirrokni proposed a two-stage sleep paradigm in a paper publicly available since September 2025, which Google Research publicized as the "sleep framework" in October 2026. Its first stage, memory consolidation, moves short-term knowledge into the model's parameters, partly through what the authors call knowledge seeding, in which the memories of a smaller version of the model are distilled into a larger network. Its second stage, which the authors call dreaming, uses reinforcement learning to have the model generate a curriculum of synthetic data that rehearses new knowledge and refines existing skills. Google's blog post reports, as the authors' results, a near-zero performance drop when the model learned unseen languages in sequence and gains over supervised fine-tuning on knowledge-incorporation and math tasks. In separate work, Lee, McLeish, Goldstein and Fanti used a sleep phase in which a model converts recent context into persistent fast weights in its state-space blocks before clearing its key-value cache. Unlike sleep-time compute, which precomputes inferences about a context without changing weights, and unlike agent-memory dreaming, which reorganizes written notes, language model sleep updates the model's parameters.
  aliases: [sleep framework, sleep paradigm, knowledge seeding]
  related: [sleep-time-compute, dreaming, knowledge-distillation, agent-memory, kv-cache, fine-tuning]
  introduced: 2025
  added: 2026-11-27
  sources:
    - {title: "Language Models Need Sleep: Learning to Self-Modify and Consolidate Memories", authors: "Behrouz et al.", year: 2026, url: "https://arxiv.org/abs/2606.03979"}
    - {title: "The sleep framework: A new way for LLMs to retain knowledge in continual learning", authors: "Behrouz and Mirrokni (Google Research)", year: 2026, url: "https://research.google/blog/the-sleep-framework-a-new-way-for-llms-to-retain-knowledge-in-continual-learning/"}
    - {title: "Do Language Models Need Sleep? Offline Recurrence for Improved Online Inference", authors: "Lee et al.", year: 2026, url: "https://arxiv.org/abs/2605.26099"}

- id: transformer
  term: Transformer
  category: foundations
  definition: The Transformer is a neural network architecture that processes sequences with self-attention, letting every position draw information directly from every other position instead of through recurrence or convolution. Most large language models are built on it.
  body: Vaswani et al. introduced the Transformer in 2017 as an encoder-decoder model for machine translation, built from stacked layers of multi-head self-attention and position-wise feed-forward networks, with residual connections, layer normalization and positional encodings to represent token order. Because attention over a whole sequence can be computed in parallel, it trains much faster than recurrent networks. The authors reported 28.4 BLEU on WMT 2014 English-to-German and a single-model 41.8 BLEU on English-to-French after training for 3.5 days on eight GPUs. Most large language models use a decoder-only variant trained to predict the next token. The cost of standard self-attention grows quadratically with sequence length, which has motivated variants such as sliding window, grouped-query and multi-head latent attention, and kernels such as FlashAttention.
  aliases: [Transformer architecture, transformer model, decoder-only transformer]
  related: [large-language-model, token, context-window, kv-cache, rotary-position-embedding, grouped-query-attention, flashattention, mixture-of-experts]
  introduced: 2017
  added: 2026-11-27
  sources:
    - {title: "Attention Is All You Need", authors: "Vaswani et al.", year: 2017, url: "https://arxiv.org/abs/1706.03762"}

- id: neural-scaling-laws
  term: Neural Scaling Laws
  category: foundations
  definition: Neural scaling laws are empirical relationships showing that a language model's training loss falls predictably, as a power law, as model size, dataset size and training compute increase.
  body: Kaplan et al. reported in 2020 that the loss of Transformer language models scales as a power law with model size, dataset size and compute across several orders of magnitude, while network width or depth have minimal effects within a wide range. They concluded that, for a fixed compute budget, it is most efficient to train very large models on a relatively modest amount of data and stop well before convergence. Hoffmann et al. revised this in 2022 after training over 400 models, finding that model size and the number of training tokens should be scaled equally. Their 70-billion-parameter Chinchilla model, trained with the same compute as the 280-billion-parameter Gopher but on four times more data, outperformed it and reached an average of 67.5% on MMLU by their account. Scaling laws are used to plan training runs and to extrapolate from small experiments.
  aliases: [scaling laws, Kaplan scaling laws, Chinchilla scaling laws, compute-optimal training]
  related: [large-language-model, foundation-model, emergent-abilities, test-time-compute-scaling]
  introduced: 2020
  added: 2026-11-27
  sources:
    - {title: "Scaling Laws for Neural Language Models", authors: "Kaplan et al.", year: 2020, url: "https://arxiv.org/abs/2001.08361"}
    - {title: "Training Compute-Optimal Large Language Models", authors: "Hoffmann et al.", year: 2022, url: "https://arxiv.org/abs/2203.15556"}

- id: sliding-window-attention
  term: Sliding Window Attention
  category: foundations
  definition: Sliding window attention is a form of attention in which each token attends only to a fixed number of nearby or preceding tokens rather than the whole sequence, so its cost grows linearly instead of quadratically with sequence length.
  body: Beltagy et al. used it in Longformer in 2020, combining local windowed attention with task-motivated global attention on a few tokens, so that the model scales linearly with sequence length. Stacking layers widens the receptive field, so information can still travel across a long document. Jiang et al. used causal sliding window attention in Mistral 7B in 2023 with a window of 4,096 tokens, reporting a theoretical attention span of about 131K tokens, and a rolling buffer cache that overwrites older keys and values and, by their account, reduces cache memory use by 8x on 32K-token sequences without affecting model quality. Tokens outside the window can be reached only indirectly through lower layers, and evicting the earliest tokens can destabilize generation unless attention sinks are kept.
  aliases: [SWA, local attention, windowed attention, rolling buffer cache]
  broader: [transformer]
  related: [kv-cache, context-window, attention-sinks, grouped-query-attention, context-window-extension, flashattention]
  introduced: 2020
  added: 2026-11-27
  sources:
    - {title: "Longformer: The Long-Document Transformer", authors: "Beltagy et al.", year: 2020, url: "https://arxiv.org/abs/2004.05150"}
    - {title: "Mistral 7B", authors: "Jiang et al.", year: 2023, url: "https://arxiv.org/abs/2310.06825"}

- id: multi-head-latent-attention
  term: Multi-Head Latent Attention
  category: foundations
  definition: Multi-head latent attention (MLA) is an attention mechanism that compresses each token's keys and values into a low-dimensional latent vector and caches only that vector, greatly shrinking the key-value cache needed during generation.
  body: DeepSeek-AI introduced MLA in the DeepSeek-V2 model in 2024. A down-projection maps each token to a compressed latent from which keys and values are reconstructed by up-projections, and a separate, decoupled rotary position embedding carries position information. The authors reported that MLA achieves better performance than standard multi-head attention, and that DeepSeek-V2 reduces the KV cache by 93.3% compared with DeepSeek 67B. Grouped-query attention shrinks the cache by sharing key-value heads; MLA instead compresses keys and values jointly.
  aliases: [MLA, latent attention]
  broader: [transformer]
  related: [kv-cache, grouped-query-attention, rotary-position-embedding, mixture-of-experts, pagedattention]
  introduced: 2024
  added: 2026-11-27
  sources:
    - {title: "DeepSeek-V2: A Strong, Economical, and Efficient Mixture-of-Experts Language Model", authors: "DeepSeek-AI", year: 2024, url: "https://arxiv.org/abs/2405.04434"}

- id: weak-to-strong-generalization
  term: Weak-to-Strong Generalization
  category: foundations
  definition: Weak-to-strong generalization is the phenomenon in which a strong model fine-tuned on labels produced by a weaker model performs better than that weaker supervisor, studied as an analogy for humans supervising models more capable than themselves.
  body: Burns et al. of OpenAI introduced the setup in 2023, arguing that methods such as RLHF depend on humans being able to judge model behavior, which may not hold for superhuman models. Fine-tuning pretrained GPT-4-family models on labels from smaller models across NLP, chess and reward-modeling tasks, they found that the strong students consistently performed better than their weak supervisors but fell short of their own capability when trained on correct labels. They measured how much of that gap was closed with a metric they call performance gap recovered (PGR). Simple methods narrowed the gap; the authors reported that fine-tuning GPT-4 with a GPT-2-level supervisor and an auxiliary confidence loss recovered close to GPT-3.5-level performance on NLP tasks.
  aliases: [W2S generalization, weak-to-strong, performance gap recovered]
  related: [rlhf, reward-model, fine-tuning, knowledge-distillation, llm-as-a-judge]
  introduced: 2023
  added: 2026-11-27
  sources:
    - {title: "Weak-to-Strong Generalization: Eliciting Strong Capabilities With Weak Supervision", authors: "Burns et al.", year: 2023, url: "https://arxiv.org/abs/2312.09390"}

- id: superficial-alignment-hypothesis
  term: Superficial Alignment Hypothesis
  category: foundations
  definition: The superficial alignment hypothesis holds that a language model learns almost all of its knowledge and capabilities during pretraining, and that alignment mainly teaches it which style and format of response to use with users, so a small set of high-quality examples can be enough to align it.
  body: Zhou et al. proposed the hypothesis in 2023 in the paper introducing LIMA. To test it they fine-tuned the 65-billion-parameter LLaMa on only 1,000 carefully curated prompts and responses with standard supervised learning, without reinforcement learning or human preference modeling. In their human evaluation, LIMA's responses were equivalent or strictly preferred to GPT-4's in 43% of cases, rising to 58% against Bard and 65% against DaVinci003. The result is often cited to argue that data quality matters more than quantity in instruction tuning.
  aliases: [LIMA, Less Is More for Alignment, superficial alignment]
  related: [instruction-tuning, base-model, rlhf, fine-tuning, self-instruct]
  introduced: 2023
  added: 2026-11-27
  sources:
    - {title: "LIMA: Less Is More for Alignment", authors: "Zhou et al.", year: 2023, url: "https://arxiv.org/abs/2305.11206"}

- id: looped-transformer
  term: Looped Transformer
  category: foundations
  definition: A looped transformer is a transformer that applies the same block of weight-shared layers several times within one forward pass, so the model gains effective depth and computation without adding parameters.
  body: Dehghani et al. proposed the Universal Transformer in 2018, which applies one shared transformer block recurrently across depth and adds a dynamic per-position halting mechanism. Giannou et al. used the name "looped transformers" in 2023, showing that a looped 13-layer transformer with fixed weights can run small programs such as a basic calculator and linear algebra routines. Zhu et al. pretrained a family of looped language models, Ouro, on 7.7T tokens in 2025, with iterative computation in latent space and an entropy-regularized objective for learned depth allocation; they reported that their 1.4B and 2.6B models match the results of up to 12B state-of-the-art models, an advantage they attribute to knowledge manipulation rather than knowledge capacity. The approach is described as a way to scale reasoning in latent computation rather than in generated tokens. The term spread in November 2026 when Z.ai described GLM-5.4 as its first "Loop Transformer", which by Z.ai's account reuses 28 layers of the GLM-5 base model across two iterations with per-token gates for each iteration, and on most benchmarks shortens average output length by 10 to 14%; these figures are vendor-reported. Z.ai also notes that the model can get caught in overly long thinking.
  aliases: [loop transformer, looped language model, LoopLM, Universal Transformer, weight-tied recurrent depth, recurrent-depth transformer]
  broader: [transformer]
  related: [test-time-compute-scaling, reasoning-model, overthinking, mixture-of-experts, neural-scaling-laws]
  introduced: 2018
  added: 2026-11-27
  sources:
    - {title: "Universal Transformers", authors: "Dehghani et al.", year: 2018, url: "https://arxiv.org/abs/1807.03819"}
    - {title: "Looped Transformers as Programmable Computers", authors: "Giannou et al.", year: 2023, url: "https://arxiv.org/abs/2301.13196"}
    - {title: "Scaling Latent Reasoning via Looped Language Models", authors: "Zhu et al.", year: 2025, url: "https://arxiv.org/abs/2510.25741"}
    - {title: "GLM-5.4", authors: "Z.ai", year: 2026, url: "https://docs.z.ai/guides/llm/glm-5.4"}

- id: external-sandbox
  term: External Sandbox
  category: security
  definition: An external sandbox is an isolation pattern for coding agents in which the agent runs outside the sandbox and sends the commands it wants to execute to a separate sandboxed environment, so that only command execution crosses the isolation boundary.
  body: The name comes from a November 2026 post by Simon Willison on the Prime Radiant blog, which explains that the sandbox is external to the agent rather than to the computer, so both can run on the same machine. The post contrasts it with running the agent inside the sandbox, as in Fly's Sprites, and argues that keeping the agent outside avoids the agent modifying itself or its direct environment and keeps the boundary well defined and easier to audit. It also argues that a sandbox is a protection that does not depend on any model's judgment, unlike model-based checks such as Claude Code's auto mode or Codex's auto-review. The post describes three implementations with a shared local protocol, based on v86 in WebAssembly, Apple Containers and a QEMU virtual machine. In them network access is off by default; an optional proxy reaches only allow-listed hosts and methods and adds API keys to requests so that secrets stay outside the sandbox. The authors call the implementations experimental and unaudited, and note that an allowed host could echo a credential back, that a read-write mount still lets the agent damage that folder, and that in Claude Code only Bash commands are routed to the sandbox while its file tools run on the host.
  aliases: [external sandboxes, external sandbox pattern]
  related: [coding-agent, code-execution-tool, auto-mode, lethal-trifecta, excessive-agency, harness-engineering, prompt-injection, guardrails]
  introduced: 2026
  added: 2026-11-27
  sources:
    - {title: "External sandboxes for coding agents", authors: "Simon Willison (Prime Radiant)", year: 2026, url: "https://blog.primeradiant.com/external-sandboxes-for-coding-agents/"}
