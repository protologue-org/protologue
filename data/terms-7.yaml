# Added in v1.2: three foundations terms and the Benchmarks branch
# Fields: id, term, category, definition (quotable, 1-2 sentences), body, aliases, broader, related, introduced, example, sources
# Benchmark entries describe what is measured and how. They deliberately carry no scores, which change too quickly to be reference material.

- id: kv-cache
  term: KV Cache
  category: foundations
  definition: The KV cache stores the attention keys and values a Transformer has already computed for earlier tokens, so that generating each new token requires computing only that token's keys and values instead of reprocessing the whole sequence.
  body: Caching makes generation fast, but its memory grows with context length and with the number of concurrent requests, which is a main constraint on long contexts and serving costs. Serving systems such as vLLM manage it in pages to reduce waste. Prompt caching extends the idea across requests by keeping the cache for a shared prompt prefix, which is why cached prompts must begin with identical content to get the discount.
  aliases: [key-value cache, KV caching]
  related: [prompt-caching, context-window, token]
  sources:
    - {title: "Efficient Memory Management for Large Language Model Serving with PagedAttention", authors: "Kwon et al.", year: 2023, url: "https://arxiv.org/abs/2309.06180"}
    - {title: "Prompt caching", authors: "Anthropic", year: 2024, url: "https://platform.claude.com/docs/en/build-with-claude/prompt-caching"}

- id: knowledge-distillation
  term: Knowledge Distillation
  category: foundations
  definition: Knowledge distillation is training a smaller student model to imitate a larger teacher model, using the teacher's output probabilities or generated responses as training targets, so that the student keeps much of the teacher's ability at lower cost.
  body: The original method trains on the teacher's full probability distribution, whose soft targets carry more information than single correct labels. With LLMs, distillation is commonly done by fine-tuning a small model on responses, including reasoning traces, generated by a large one, which is how several small reasoning models have been built. Some model providers' terms restrict using their outputs to train competing models.
  aliases: [distillation, model distillation, teacher-student training]
  broader: [fine-tuning]
  related: [reasoning-model, model-cascade]
  introduced: 2015
  sources:
    - {title: "Distilling the Knowledge in a Neural Network", authors: "Hinton et al.", year: 2015, url: "https://arxiv.org/abs/1503.02531"}
    - {title: "DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning", authors: "DeepSeek-AI et al.", year: 2025, url: "https://arxiv.org/abs/2501.12948"}

- id: emergent-abilities
  term: Emergent Abilities
  category: foundations
  definition: Emergent abilities are capabilities that appear in large language models above a certain scale but are near chance in smaller ones, such as multi-step arithmetic or benefiting from chain-of-thought prompting.
  body: The idea explained why some prompting techniques only work with large models. It is disputed. Later analysis argued that many apparent jumps are artifacts of all-or-nothing metrics such as exact match, and that smoother metrics show gradual improvement with scale. The practical lesson stands either way, which is that a technique that fails on a small model may work on a larger one, and the reverse.
  aliases: [emergence, emergent capabilities]
  related: [large-language-model, chain-of-thought, in-context-learning, benchmark]
  introduced: 2022
  sources:
    - {title: "Emergent Abilities of Large Language Models", authors: "Wei et al.", year: 2022, url: "https://arxiv.org/abs/2206.07682"}
    - {title: "Are Emergent Abilities of Large Language Models a Mirage?", authors: "Schaeffer et al.", year: 2023, url: "https://arxiv.org/abs/2304.15004"}

- id: benchmark
  term: Benchmark
  category: benchmarks
  definition: A benchmark is a fixed, public set of test tasks with a standard scoring method, used to measure and compare the capabilities of language models.
  body: Reported scores depend on the prompting setup, such as the number of examples, whether chain-of-thought or extended thinking is used, and how many attempts are sampled, so scores are only comparable under the same conditions. Public benchmarks also risk data contamination and eventually saturate. They are useful for choosing models, but an application's own evals are the better guide to how a model will perform on its tasks.
  aliases: [LLM benchmark, evaluation benchmark]
  related: [evals, data-contamination, benchmark-saturation, pass-at-k]
  sources:
    - {title: "Holistic Evaluation of Language Models", authors: "Liang et al.", year: 2022, url: "https://arxiv.org/abs/2211.09110"}
    - {title: "Beyond the Imitation Game: Quantifying and extrapolating the capabilities of language models", authors: "Srivastava et al.", year: 2022, url: "https://arxiv.org/abs/2206.04615"}

- id: benchmark-saturation
  term: Benchmark Saturation
  category: benchmarks
  definition: Benchmark saturation is when the best models score near a benchmark's maximum, so that it no longer distinguishes between them and its remaining errors mostly reflect flawed or ambiguous questions.
  body: Saturation has followed every widely used benchmark, often within a few years, and is a main reason new, harder benchmarks keep appearing. MMLU-Pro and Humanity's Last Exam were both created because earlier benchmarks had saturated. Contamination can make a benchmark look saturated before models have truly mastered it.
  aliases: [saturated benchmark]
  broader: [benchmark]
  related: [data-contamination, mmlu, humanitys-last-exam]
  sources:
    - {title: "Humanity's Last Exam", authors: "Phan et al.", year: 2025, url: "https://arxiv.org/abs/2501.14249"}
    - {title: "MMLU-Pro: A More Robust and Challenging Multi-Task Language Understanding Benchmark", authors: "Wang et al.", year: 2024, url: "https://arxiv.org/abs/2406.01574"}

- id: mmlu
  term: MMLU
  category: benchmarks
  definition: MMLU (Massive Multitask Language Understanding) is a benchmark of four-option multiple-choice questions across 57 subjects, from elementary mathematics to law and medicine, that measures a model's breadth of knowledge and problem solving.
  body: It was the standard headline score for general knowledge for several years and is traditionally reported with five examples in the prompt (5-shot). Frontier models now score near the top, so it is considered saturated, and it has largely been succeeded by harder variants such as MMLU-Pro.
  aliases: [Massive Multitask Language Understanding]
  broader: [benchmark]
  related: [mmlu-pro, gpqa, benchmark-saturation, few-shot-prompting]
  introduced: 2020
  sources:
    - {title: "Measuring Massive Multitask Language Understanding", authors: "Hendrycks et al.", year: 2020, url: "https://arxiv.org/abs/2009.03300"}

- id: mmlu-pro
  term: MMLU-Pro
  category: benchmarks
  definition: MMLU-Pro is a harder, reasoning-focused successor to MMLU that offers ten answer options instead of four and replaces trivial or noisy questions with more challenging ones.
  body: More options lower the score obtainable by guessing, and the harder questions make chain-of-thought prompting matter more than it does on MMLU. Its creators also reported that scores vary less with the wording of the prompt than on the original benchmark.
  broader: [benchmark]
  related: [mmlu, gpqa, chain-of-thought, prompt-sensitivity]
  introduced: 2024
  sources:
    - {title: "MMLU-Pro: A More Robust and Challenging Multi-Task Language Understanding Benchmark", authors: "Wang et al.", year: 2024, url: "https://arxiv.org/abs/2406.01574"}

- id: gpqa
  term: GPQA
  category: benchmarks
  definition: GPQA (Graduate-Level Google-Proof Q&A) is a benchmark of difficult multiple-choice questions in biology, physics, and chemistry, written by domain experts so that skilled non-experts cannot answer them reliably even with unrestricted web access.
  body: Its high-quality "Diamond" subset is the version most often reported in model announcements. Because the questions resist search, it measures expert-level reasoning more than retrieval. It is also used to study scalable oversight, the question of how people can supervise models that know more than they do.
  aliases: [GPQA Diamond, Graduate-Level Google-Proof Q&A]
  broader: [benchmark]
  related: [mmlu-pro, humanitys-last-exam, reasoning-model]
  introduced: 2023
  sources:
    - {title: "GPQA: A Graduate-Level Google-Proof Q&A Benchmark", authors: "Rein et al.", year: 2023, url: "https://arxiv.org/abs/2311.12022"}

- id: humanitys-last-exam
  term: Humanity's Last Exam
  category: benchmarks
  definition: Humanity's Last Exam (HLE) is a benchmark of 2,500 expert-written questions across dozens of academic subjects, some with images, designed to remain hard for frontier models after earlier academic benchmarks saturated.
  body: Questions were contributed by subject experts and kept only if leading models failed them at the time, and answers are short and automatically checkable. Its creators also measure calibration, how well a model's stated confidence matches its accuracy, because models often answer the questions they get wrong with high confidence.
  aliases: [HLE]
  broader: [benchmark]
  related: [benchmark-saturation, gpqa, confidence-calibration]
  introduced: 2025
  sources:
    - {title: "Humanity's Last Exam", authors: "Phan et al.", year: 2025, url: "https://arxiv.org/abs/2501.14249"}

- id: big-bench-hard
  term: BIG-Bench Hard
  category: benchmarks
  definition: BIG-Bench Hard (BBH) is a set of 23 challenging tasks from the BIG-bench collection on which earlier language models performed below average human raters, used to measure multi-step reasoning.
  body: Its creators showed that chain-of-thought prompting greatly improved results on these tasks, which made BBH a standard test of reasoning-elicitation techniques. BIG-bench itself is a collaborative collection of over 200 tasks.
  aliases: [BBH, BIG-bench]
  broader: [benchmark]
  related: [chain-of-thought, few-shot-prompting]
  introduced: 2022
  sources:
    - {title: "Challenging BIG-Bench Tasks and Whether Chain-of-Thought Can Solve Them", authors: "Suzgun et al.", year: 2022, url: "https://arxiv.org/abs/2210.09261"}
    - {title: "Beyond the Imitation Game: Quantifying and extrapolating the capabilities of language models", authors: "Srivastava et al.", year: 2022, url: "https://arxiv.org/abs/2206.04615"}

- id: arc-agi
  term: ARC-AGI
  category: benchmarks
  definition: ARC-AGI (the Abstraction and Reasoning Corpus) is a benchmark of visual grid puzzles in which a model must infer a transformation rule from a few examples and apply it to a new grid, designed to measure how efficiently a system acquires new skills.
  body: The puzzles are easy for most people but require reasoning that cannot be memorized, because each task is novel. François Chollet introduced it in 2019 alongside a definition of intelligence as skill-acquisition efficiency. Successive versions, such as ARC-AGI-2, were made harder as systems improved, and many results are reported with explicit compute costs.
  aliases: [ARC, Abstraction and Reasoning Corpus, ARC-AGI-2, ARC Prize]
  broader: [benchmark]
  related: [test-time-compute-scaling, reasoning-model]
  introduced: 2019
  sources:
    - {title: "On the Measure of Intelligence", authors: "Chollet", year: 2019, url: "https://arxiv.org/abs/1911.01547"}
    - {title: "ARC-AGI-2: A New Challenge for Frontier AI Reasoning Systems", authors: "Chollet et al.", year: 2025, url: "https://arxiv.org/abs/2505.11831"}

- id: simpleqa
  term: SimpleQA
  category: benchmarks
  definition: SimpleQA is a benchmark of short, fact-seeking questions with a single indisputable answer, collected adversarially against strong models, that measures whether a model answers factual questions correctly and declines when it does not know.
  body: Answers are graded as correct, incorrect, or not attempted, so it rewards knowing what you don't know as well as knowing facts. It is used to measure hallucination in closed-book settings and the effect of adding search.
  broader: [benchmark]
  related: [hallucination, confidence-calibration, web-search-tool, truthfulqa]
  introduced: 2024
  sources:
    - {title: "Measuring short-form factuality in large language models", authors: "Wei et al.", year: 2024, url: "https://arxiv.org/abs/2411.04368"}

- id: truthfulqa
  term: TruthfulQA
  category: benchmarks
  definition: TruthfulQA is a benchmark of questions crafted so that some people would answer them falsely because of common misconceptions, used to measure whether a model repeats popular falsehoods instead of answering truthfully.
  body: Its creators found that larger models of the time were often less truthful, because they imitated human misconceptions in their training data more faithfully. It remains a common reference for truthfulness, though, like other older public benchmarks, it is exposed to data contamination.
  broader: [benchmark]
  related: [hallucination, sycophancy, simpleqa]
  introduced: 2021
  sources:
    - {title: "TruthfulQA: Measuring How Models Mimic Human Falsehoods", authors: "Lin et al.", year: 2021, url: "https://arxiv.org/abs/2109.07958"}

- id: hellaswag
  term: HellaSwag
  category: benchmarks
  definition: HellaSwag is a commonsense reasoning benchmark in which a model must pick the most plausible continuation of a description of an everyday situation from four options, with wrong options generated and filtered to fool models.
  body: When it was introduced, the questions were trivial for people but hard for the best models. Modern models score close to human level, so it is a standard example of a saturated benchmark, though it still appears in model reports.
  broader: [benchmark]
  related: [benchmark-saturation]
  introduced: 2019
  sources:
    - {title: "HellaSwag: Can a Machine Really Finish Your Sentence?", authors: "Zellers et al.", year: 2019, url: "https://arxiv.org/abs/1905.07830"}

- id: mmmu
  term: MMMU
  category: benchmarks
  definition: MMMU (Massive Multi-discipline Multimodal Understanding) is a benchmark of college-level questions that require reasoning over images, such as charts, diagrams, tables, and chemical structures, together with text, across 30 subjects in six disciplines.
  body: It tests whether multimodal models can combine visual perception with domain knowledge, not only describe images. It is a standard headline score for vision-language models.
  broader: [benchmark]
  related: [multimodal-prompting, mmlu]
  introduced: 2023
  sources:
    - {title: "MMMU: A Massive Multi-discipline Multimodal Understanding and Reasoning Benchmark for Expert AGI", authors: "Yue et al.", year: 2023, url: "https://arxiv.org/abs/2311.16502"}

- id: gsm8k
  term: GSM8K
  category: benchmarks
  definition: GSM8K is a benchmark of about 8,500 grade-school math word problems that each take several steps of basic arithmetic to solve, used to measure multi-step mathematical reasoning.
  body: It was the main testbed for chain-of-thought, self-consistency, and many other reasoning techniques, and was introduced together with the idea of training verifiers to check solutions. Frontier models now solve nearly all of it, so it is saturated, but variants that add irrelevant information or change numbers still reveal brittleness.
  aliases: [Grade School Math 8K]
  broader: [benchmark]
  related: [chain-of-thought, self-consistency, irrelevant-context-distraction, math-benchmark]
  introduced: 2021
  sources:
    - {title: "Training Verifiers to Solve Math Word Problems", authors: "Cobbe et al.", year: 2021, url: "https://arxiv.org/abs/2110.14168"}

- id: math-benchmark
  term: MATH
  category: benchmarks
  definition: MATH is a benchmark of 12,500 competition mathematics problems, spanning seven subjects and five difficulty levels, each with a full step-by-step solution.
  body: It is much harder than grade-school arithmetic and was long a key measure of mathematical reasoning. A 500-problem subset, MATH-500, created for research on process supervision, is the version most often reported today.
  aliases: [MATH dataset, MATH-500]
  broader: [benchmark]
  related: [gsm8k, aime, process-reward-model]
  introduced: 2021
  sources:
    - {title: "Measuring Mathematical Problem Solving With the MATH Dataset", authors: "Hendrycks et al.", year: 2021, url: "https://arxiv.org/abs/2103.03874"}
    - {title: "Let's Verify Step by Step", authors: "Lightman et al.", year: 2023, url: "https://arxiv.org/abs/2305.20050"}

- id: aime
  term: AIME
  category: benchmarks
  definition: AIME, the American Invitational Mathematics Examination, is a US high-school mathematics competition whose problems, each with an integer answer, are widely used as a benchmark for reasoning models, usually identified by year, as in AIME 2024 or AIME 2025.
  body: Each exam has only 15 problems, so scores are typically averaged over many sampled attempts and vary noticeably between runs. A new exam each year provides problems written after many models' training data was collected, which limits contamination.
  aliases: [AIME 2024, AIME 2025, American Invitational Mathematics Examination]
  broader: [benchmark]
  related: [math-benchmark, reasoning-model, test-time-compute-scaling, self-consistency]
  sources:
    - {title: "Learning to reason with LLMs", authors: "OpenAI", year: 2024, url: "https://openai.com/index/learning-to-reason-with-llms/"}
    - {title: "s1: Simple test-time scaling", authors: "Muennighoff et al.", year: 2025, url: "https://arxiv.org/abs/2501.19393"}

- id: humaneval
  term: HumanEval
  category: benchmarks
  definition: HumanEval is a benchmark of 164 hand-written Python programming problems, each with a function signature, a description, and hidden unit tests, used to measure code generation with the pass@k metric.
  body: It established functional correctness, whether generated code passes tests, as the standard for evaluating code models, rather than similarity to a reference solution. It is now saturated and small, so harder and contamination-resistant benchmarks such as LiveCodeBench and SWE-bench have taken its place.
  broader: [benchmark]
  related: [pass-at-k, livecodebench, swe-bench]
  introduced: 2021
  sources:
    - {title: "Evaluating Large Language Models Trained on Code", authors: "Chen et al.", year: 2021, url: "https://arxiv.org/abs/2107.03374"}

- id: livecodebench
  term: LiveCodeBench
  category: benchmarks
  definition: LiveCodeBench is a coding benchmark that continuously collects new problems from programming contests, such as LeetCode, AtCoder, and Codeforces, so that models can be evaluated only on problems published after their training data was collected.
  body: Dating each problem lets evaluators detect and avoid data contamination. Besides code generation, it covers self-repair, predicting the output of code, and predicting test outputs.
  broader: [benchmark]
  related: [data-contamination, humaneval, pass-at-k]
  introduced: 2024
  sources:
    - {title: "LiveCodeBench: Holistic and Contamination Free Evaluation of Large Language Models for Code", authors: "Jain et al.", year: 2024, url: "https://arxiv.org/abs/2403.07974"}

- id: swe-bench
  term: SWE-bench
  category: benchmarks
  definition: SWE-bench is a benchmark of real GitHub issues from popular Python repositories, in which a model or agent must edit the codebase so that tests written for the actual fix pass.
  body: It measures practical software engineering in large, unfamiliar codebases rather than isolated functions, and is the standard benchmark for coding agents. Because some original tasks were underspecified or had faulty tests, a 500-task subset screened by human developers, SWE-bench Verified, is the version most often reported.
  aliases: [SWE-bench Verified]
  broader: [benchmark]
  related: [coding-agent, humaneval, terminal-bench]
  introduced: 2023
  sources:
    - {title: "SWE-bench: Can Language Models Resolve Real-World GitHub Issues?", authors: "Jimenez et al.", year: 2023, url: "https://arxiv.org/abs/2310.06770"}
    - {title: "Introducing SWE-bench Verified", authors: "OpenAI", year: 2024, url: "https://openai.com/index/introducing-swe-bench-verified/"}

- id: terminal-bench
  term: Terminal-Bench
  category: benchmarks
  definition: Terminal-Bench is a benchmark of hard, realistic tasks that an AI agent must complete by running commands in a containerized Linux terminal, graded by automated tests of the final state of the environment.
  body: Grading checks outcomes, not the commands used, so agents can solve tasks any way that works. It measures the command-line skills that coding and DevOps agents rely on, such as building software, configuring systems, and debugging.
  broader: [benchmark]
  related: [coding-agent, swe-bench, code-execution-tool]
  sources:
    - {title: "Terminal-Bench: Benchmarking Agents on Hard, Realistic Tasks in Command Line Interfaces", authors: "Merrill et al.", year: 2026, url: "https://arxiv.org/abs/2601.11868"}

- id: tau-bench
  term: τ-bench
  category: benchmarks
  definition: τ-bench is a benchmark in which an agent with API tools and a written domain policy, for example for airline or retail customer service, converses with a simulated user and is judged by whether the final database state is correct.
  body: It tests tool use, policy following, and conversation together, as in real deployments. It introduced pass^k, the probability that an agent succeeds on all of k repeated trials of the same task, which exposes how inconsistent agents can be even when they often succeed once.
  aliases: [tau-bench, TAU-bench, pass^k]
  broader: [benchmark]
  related: [function-calling, ai-agent, pass-at-k]
  introduced: 2024
  sources:
    - {title: "τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains", authors: "Yao et al.", year: 2024, url: "https://arxiv.org/abs/2406.12045"}

- id: osworld
  term: OSWorld
  category: benchmarks
  definition: OSWorld is a benchmark of open-ended tasks that computer-use agents must complete in real operating systems and applications, graded by scripts that check the resulting state of the computer.
  body: Tasks span office software, web browsers, file management, and multi-application workflows. It is the standard benchmark for computer-use agents and showed a large gap between early agents and people.
  broader: [benchmark]
  related: [computer-use-agent, multimodal-prompting]
  introduced: 2024
  sources:
    - {title: "OSWorld: Benchmarking Multimodal Agents for Open-Ended Tasks in Real Computer Environments", authors: "Xie et al.", year: 2024, url: "https://arxiv.org/abs/2404.07972"}

- id: gaia
  term: GAIA
  category: benchmarks
  definition: GAIA is a benchmark for general AI assistants made of questions that are conceptually simple for people but require several steps of web browsing, file reading, multimodal understanding, and tool use to answer.
  body: Each question has a single short answer, which makes grading exact despite the open-ended process. It contrasts with benchmarks of expert knowledge by testing whether assistants can reliably carry out ordinary multi-step tasks.
  broader: [benchmark]
  related: [ai-agent, web-search-tool, browsecomp]
  introduced: 2023
  sources:
    - {title: "GAIA: a benchmark for General AI Assistants", authors: "Mialon et al.", year: 2023, url: "https://arxiv.org/abs/2311.12983"}

- id: browsecomp
  term: BrowseComp
  category: benchmarks
  definition: BrowseComp is a benchmark of hard-to-find but easy-to-verify questions that require an agent to search the web persistently and creatively, often across many pages, to locate an entangled piece of information.
  body: Answers are short so grading is simple, while finding them can take a person hours. It measures the persistence and search strategy of browsing and deep-research agents rather than knowledge the model already has.
  broader: [benchmark]
  related: [web-search-tool, agentic-rag, gaia]
  introduced: 2025
  sources:
    - {title: "BrowseComp: A Simple Yet Challenging Benchmark for Browsing Agents", authors: "Wei et al.", year: 2025, url: "https://arxiv.org/abs/2504.12516"}

- id: ifeval
  term: IFEval
  category: benchmarks
  definition: IFEval (Instruction-Following Eval) is a benchmark of prompts containing instructions whose compliance can be checked automatically, such as "write at least 300 words" or "do not use any commas", used to measure instruction following without a human or model judge.
  body: Verifiable instructions make scoring objective and cheap, which is why IFEval is a common headline score for instruction-tuned models. It measures adherence to format and content constraints, not answer quality.
  aliases: [Instruction-Following Eval]
  broader: [benchmark]
  related: [instruction-following, mt-bench]
  introduced: 2023
  sources:
    - {title: "Instruction-Following Evaluation for Large Language Models", authors: "Zhou et al.", year: 2023, url: "https://arxiv.org/abs/2311.07911"}

- id: mt-bench
  term: MT-Bench
  category: benchmarks
  definition: MT-Bench is a benchmark of 80 two-turn questions across categories such as writing, reasoning, math, and coding, in which a strong LLM acts as the judge and scores each response.
  body: It was introduced with the systematic study of LLM-as-a-judge, which found that strong model judges agreed with human preferences about as well as people agreed with each other, and also documented judge biases. Its small size and reliance on a model judge limit how finely it can separate today's models.
  broader: [benchmark]
  related: [llm-as-a-judge, llm-judge-bias, chatbot-arena]
  introduced: 2023
  sources:
    - {title: "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena", authors: "Zheng et al.", year: 2023, url: "https://arxiv.org/abs/2306.05685"}

- id: chatbot-arena
  term: Chatbot Arena
  category: benchmarks
  definition: Chatbot Arena is a public platform where people chat with two anonymous models side by side and vote for the better response, with the votes aggregated into a leaderboard of model ratings.
  body: Crowdsourced preferences capture open-ended quality that fixed test sets miss, and new questions from real users resist contamination. Ratings can also reflect style, such as length and formatting, which is why style-controlled rankings are offered. The platform was later renamed, first LMArena and then Arena.
  aliases: [LMArena, Arena, LMSYS Chatbot Arena]
  broader: [benchmark]
  related: [mt-bench, llm-judge-bias, llm-as-a-judge]
  introduced: 2023
  sources:
    - {title: "Chatbot Arena: An Open Platform for Evaluating LLMs by Human Preference", authors: "Chiang et al.", year: 2024, url: "https://arxiv.org/abs/2403.04132"}

- id: ruler
  term: RULER
  category: benchmarks
  definition: RULER is a synthetic long-context benchmark that extends needle-in-a-haystack retrieval with harder tasks, such as multiple needles, multi-hop tracing, and aggregation, at configurable context lengths, to measure how much of its context window a model can actually use.
  body: Its creators found that many models performed well on simple needle retrieval but degraded well before their advertised context length on the harder tasks. It is a standard reference for a model's effective, as opposed to claimed, context size.
  broader: [benchmark]
  related: [needle-in-a-haystack, context-window, context-rot, lost-in-the-middle]
  introduced: 2024
  sources:
    - {title: "RULER: What's the Real Context Size of Your Long-Context Language Models?", authors: "Hsieh et al.", year: 2024, url: "https://arxiv.org/abs/2404.06654"}
